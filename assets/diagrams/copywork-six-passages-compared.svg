<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img">
<title>Six classic copywork passages compared by length, features worth noticing and suggested starting ages. The ages are rough guides; the choice depends on the child.</title>
<desc>A table of six rows. Stevenson, Rain: two to four lines, rhyme and capitals, 7 and up. Aesop, Slow but steady wins the race: one line, a whole saying, ages 7 and up. Stevenson, Bed in Summer: two lines, a hyphen, 7 and up. Black Beauty's opening: one sentence, a narrator who is a horse, 8 and up. The Wind in the Willows' opening: one sentence, a comma, 9 and up. Alice, Curiouser and curiouser: one long line, speech marks and brackets, 10 and up. Footnote: ages are a rough guide; go by the child.</desc>
<rect width="700" height="470" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Six classic passages, compared</text>
<text x="40" y="84" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Passage</text>
<text x="300" y="84" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Length</text>
<text x="400" y="84" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">New to notice</text>
<text x="590" y="84" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Ages</text>
<line x1="30" y1="94" x2="670" y2="94" stroke="#2b2620" stroke-width="2"/>
<rect x="30" y="102" width="640" height="50" rx="0" fill="#eceef4" stroke="#eceef4" stroke-width="1"/>
<text x="40" y="128" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Stevenson, “Rain”</text>
<text x="300" y="128" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">2-4 lines</text>
<text x="400" y="128" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">rhyme, capitals</text>
<text x="590" y="128" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">7+</text>
<text x="40" y="180" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Aesop: Slow but steady...</text>
<text x="300" y="180" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">1 line</text>
<text x="400" y="180" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">a whole saying</text>
<text x="590" y="180" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">7+</text>
<rect x="30" y="206" width="640" height="50" rx="0" fill="#eceef4" stroke="#eceef4" stroke-width="1"/>
<text x="40" y="232" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Stevenson, “Bed in Summer”</text>
<text x="300" y="232" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">2 lines</text>
<text x="400" y="232" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">a hyphen</text>
<text x="590" y="232" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">7+</text>
<text x="40" y="284" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Black Beauty, opening</text>
<text x="300" y="284" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">1 sentence</text>
<text x="400" y="284" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">a narrator who is a horse</text>
<text x="590" y="284" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">8+</text>
<rect x="30" y="310" width="640" height="50" rx="0" fill="#eceef4" stroke="#eceef4" stroke-width="1"/>
<text x="40" y="336" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Wind in the Willows, opening</text>
<text x="300" y="336" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">1 sentence</text>
<text x="400" y="336" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">a comma</text>
<text x="590" y="336" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">9+</text>
<text x="40" y="388" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Alice, “Curiouser...”</text>
<text x="300" y="388" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">1 long line</text>
<text x="400" y="388" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">speech marks, brackets</text>
<text x="590" y="388" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">10+</text>
<text x="350" y="446" font-size="15" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Ages are a rough guide: go by the child, not the number.</text>
</svg>
