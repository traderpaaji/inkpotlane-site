<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1047" width="700" height="1047" role="img">
<title>Who wrote The Night Before Christmas? The authorship dispute from the anonymous 1823 printing to the computer studies of 2023.</title>
<desc>A timeline down the middle, with Clement Clarke Moore on the left and Henry Livingston Jr. on the right. At the top, 23 December 1823: the Troy Sentinel prints the poem with no name, as Account of a Visit from St. Nicholas. 1828, right: Livingston dies, and no record of him claiming the poem survives. 1837, left: Moore's name is first attached in print, in The New-York Book of Poetry. 1844, left: Moore puts it in his own collection, Poems. 2000, right: scholar Don Foster makes the case for Livingston. 2016, right: MacDonald P. Jackson's statistical study favors Livingston. 2023, left: two computer analyses favor Moore. At the bottom: still unsettled.</desc>
<rect width="700" height="1047" fill="#fbf8f2"/>
<line x1="350" y1="134" x2="350" y2="981" stroke="#d9d1c3" stroke-width="4"/>
<rect x="16" y="16" width="668" height="118" rx="10" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/>
<text x="350" y="58" font-size="26" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">23 December 1823</text>
<text x="350" y="92" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">The Troy Sentinel prints it with no name, as</text>
<text x="350" y="120" font-size="22" fill="#2b2620" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">“Account of a Visit from St. Nicholas”</text>
<text x="178" y="186" font-size="23" fill="#a35f0c" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Clement Clarke Moore</text>
<text x="522" y="186" font-size="23" fill="#b8323a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Henry Livingston Jr.</text>
<rect x="410" y="214" width="260" height="109" rx="10" fill="#ffffff" stroke="#b8323a" stroke-width="2.5"/>
<text x="424" y="247" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Livingston dies. No</text>
<text x="424" y="276" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">record of him claiming</text>
<text x="424" y="305" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">the poem survives.</text>
<line x1="380" y1="268" x2="410" y2="268" stroke="#b8323a" stroke-width="2.5"/>
<rect x="314" y="250" width="72" height="36" rx="18" fill="#2b2620"/>
<text x="350" y="276" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1828</text>
<rect x="30" y="345" width="260" height="138" rx="10" fill="#ffffff" stroke="#f2a03d" stroke-width="2.5"/>
<text x="44" y="378" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Moore's name is first</text>
<text x="44" y="407" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">attached in print, in</text>
<text x="44" y="436" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">The New-York Book of</text>
<text x="44" y="465" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Poetry.</text>
<line x1="290" y1="414" x2="320" y2="414" stroke="#f2a03d" stroke-width="2.5"/>
<rect x="314" y="396" width="72" height="36" rx="18" fill="#2b2620"/>
<text x="350" y="422" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1837</text>
<rect x="30" y="505" width="260" height="80" rx="10" fill="#ffffff" stroke="#f2a03d" stroke-width="2.5"/>
<text x="44" y="538" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Moore puts it in his</text>
<text x="44" y="567" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">own collection, Poems.</text>
<line x1="290" y1="545" x2="320" y2="545" stroke="#f2a03d" stroke-width="2.5"/>
<rect x="314" y="527" width="72" height="36" rx="18" fill="#2b2620"/>
<text x="350" y="553" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1844</text>
<rect x="410" y="607" width="260" height="109" rx="10" fill="#ffffff" stroke="#b8323a" stroke-width="2.5"/>
<text x="424" y="640" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Scholar Don Foster</text>
<text x="424" y="669" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">makes the case for</text>
<text x="424" y="698" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Livingston.</text>
<line x1="380" y1="661" x2="410" y2="661" stroke="#b8323a" stroke-width="2.5"/>
<rect x="314" y="643" width="72" height="36" rx="18" fill="#2b2620"/>
<text x="350" y="669" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2000</text>
<rect x="410" y="738" width="260" height="109" rx="10" fill="#ffffff" stroke="#b8323a" stroke-width="2.5"/>
<text x="424" y="771" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">MacDonald P. Jackson's</text>
<text x="424" y="800" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">statistical study</text>
<text x="424" y="829" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">favors Livingston.</text>
<line x1="380" y1="792" x2="410" y2="792" stroke="#b8323a" stroke-width="2.5"/>
<rect x="314" y="774" width="72" height="36" rx="18" fill="#2b2620"/>
<text x="350" y="800" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2016</text>
<rect x="30" y="869" width="260" height="80" rx="10" fill="#ffffff" stroke="#f2a03d" stroke-width="2.5"/>
<text x="44" y="902" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Two computer analyses</text>
<text x="44" y="931" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">favor Moore.</text>
<line x1="290" y1="909" x2="320" y2="909" stroke="#f2a03d" stroke-width="2.5"/>
<rect x="314" y="891" width="72" height="36" rx="18" fill="#2b2620"/>
<text x="350" y="917" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2023</text>
<rect x="200" y="977" width="300" height="52" rx="26" fill="#2b2620"/>
<text x="350" y="1012" font-size="25" fill="#f6d64a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Still unsettled</text>
</svg>
