<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img">
<title>How to make a vision board, start to finish: think first, choose three to five life areas, gather pictures and words, lay it out and photograph it, glue with a glue stick, hang it where you look every day, and check in four times in 2027.</title>
<desc>A numbered list from one to seven joined by a vertical line. 1, think first: ten minutes of questions before any cutting. 2, choose three to five areas, not all of life at once. 3, gather pictures and words: pictures of you doing it, plus short words and dates. 4, lay it out, then photograph it, before any glue. 5, glue with a glue stick, which keeps thin paper flat. 6, hang it where you look every day. 7, check in four times a year. A band at the bottom gives the 2027 check-in dates: March 31, June 30, September 30 and December 31.</desc>
<rect width="700" height="700" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">How to make a vision board, start to finish</text>
<circle cx="70" cy="100" r="24" fill="#b5623f"/>
<text x="70" y="108" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="112" y="96" font-size="20" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Think first</text>
<text x="112" y="120" font-size="17" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Ten minutes of questions before any cutting.</text>
<line x1="70" y1="124" x2="70" y2="146" stroke="#d9d1c3" stroke-width="3"/>
<circle cx="70" cy="176" r="24" fill="#b5623f"/>
<text x="70" y="184" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="112" y="172" font-size="20" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Choose three to five areas</text>
<text x="112" y="196" font-size="17" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Not all of life at once. A few things, said clearly.</text>
<line x1="70" y1="200" x2="70" y2="222" stroke="#d9d1c3" stroke-width="3"/>
<circle cx="70" cy="252" r="24" fill="#b5623f"/>
<text x="70" y="260" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="112" y="248" font-size="20" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Gather pictures and words</text>
<text x="112" y="272" font-size="17" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Pictures of you doing it, plus short words and dates.</text>
<line x1="70" y1="276" x2="70" y2="298" stroke="#d9d1c3" stroke-width="3"/>
<circle cx="70" cy="328" r="24" fill="#b5623f"/>
<text x="70" y="336" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="112" y="324" font-size="20" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Lay it out, then photograph it</text>
<text x="112" y="348" font-size="17" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Move everything around before a drop of glue.</text>
<line x1="70" y1="352" x2="70" y2="374" stroke="#d9d1c3" stroke-width="3"/>
<circle cx="70" cy="404" r="24" fill="#b5623f"/>
<text x="70" y="412" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">5</text>
<text x="112" y="400" font-size="20" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Glue with a glue stick</text>
<text x="112" y="424" font-size="17" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">It keeps thin paper flat; wet glue wrinkles it.</text>
<line x1="70" y1="428" x2="70" y2="450" stroke="#d9d1c3" stroke-width="3"/>
<circle cx="70" cy="480" r="24" fill="#b5623f"/>
<text x="70" y="488" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">6</text>
<text x="112" y="476" font-size="20" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Hang it where you look daily</text>
<text x="112" y="500" font-size="17" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Beside the mirror or the desk, not in a cupboard.</text>
<line x1="70" y1="504" x2="70" y2="526" stroke="#d9d1c3" stroke-width="3"/>
<circle cx="70" cy="556" r="24" fill="#b5623f"/>
<text x="70" y="564" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">7</text>
<text x="112" y="552" font-size="20" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Check in four times a year</text>
<text x="112" y="576" font-size="17" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Change what no longer fits. Add what moved.</text>
<rect x="40" y="616" width="620" height="60" rx="8" fill="#f1ebe1" stroke="#b5623f" stroke-width="2"/>
<text x="350" y="642" font-size="17" fill="#b5623f" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2027 check-ins</text>
<text x="350" y="664" font-size="17" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">March 31  ·  June 30  ·  September 30  ·  December 31</text>
</svg>
