<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 711" width="700" height="711" role="img">
<title>Three questions to ask before choosing a Diwali book: Which tradition does it describe, whose family experience does it show, and is it right for the child's age?</title>
<desc>Three-card book-selection checklist. First: which story or tradition does this book describe? Second: whose family experience does it show? Third: which age group is it written for? Closing reminder: tell your own family's version alongside it.</desc>
<rect width="700" height="711" fill="#fbf8f2"/>
<text x="350" y="46" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Before you choose: check the book</text>
<rect x="16" y="72" width="668" height="165" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="72" width="10" height="165" rx="4" fill="#f2a03d"/>
<path d="M 46.0 166.0 Q 72.0 194.6 98.0 166.0 Z" fill="#f2a03d" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/><line x1="46.0" y1="166.0" x2="98.0" y2="166.0" stroke="#2b2620" stroke-width="2.5"/><path d="M 72.0 139.6 C 82.7 156.2 79.8 164.0 72.0 164.0 C 64.2 164.0 61.3 156.2 72.0 139.6 Z" fill="#f6d64a" stroke="#f2a03d" stroke-width="2"/>
<text x="72" y="102" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="130" y="112" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Which tradition does it describe?</text>
<text x="130" y="142" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Rama and Sita coming home? Lakshmi? Krishna?</text>
<text x="130" y="171" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Mahavira? Bandi Chhor Divas? Read the back cover</text>
<text x="130" y="200" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">and the first page.</text>
<rect x="16" y="253" width="668" height="165" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="253" width="10" height="165" rx="4" fill="#f2a03d"/>
<path d="M 46.0 347.0 Q 72.0 375.6 98.0 347.0 Z" fill="#f2a03d" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/><line x1="46.0" y1="347.0" x2="98.0" y2="347.0" stroke="#2b2620" stroke-width="2.5"/><path d="M 72.0 320.6 C 82.7 337.2 79.8 345.0 72.0 345.0 C 64.2 345.0 61.3 337.2 72.0 320.6 Z" fill="#f6d64a" stroke="#f2a03d" stroke-width="2"/>
<text x="72" y="283" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="130" y="293" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Whose family does it show?</text>
<text x="130" y="323" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A book may show a family like yours or a</text>
<text x="130" y="352" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">different one. Either can start a good talk. No</text>
<text x="130" y="381" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">one book speaks for every family.</text>
<rect x="16" y="434" width="668" height="165" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="434" width="10" height="165" rx="4" fill="#f2a03d"/>
<path d="M 46.0 528.0 Q 72.0 556.6 98.0 528.0 Z" fill="#f2a03d" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/><line x1="46.0" y1="528.0" x2="98.0" y2="528.0" stroke="#2b2620" stroke-width="2.5"/><path d="M 72.0 501.6 C 82.7 518.2 79.8 526.0 72.0 526.0 C 64.2 526.0 61.3 518.2 72.0 501.6 Z" fill="#f6d64a" stroke="#f2a03d" stroke-width="2"/>
<text x="72" y="464" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="130" y="474" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Which age is it for?</text>
<text x="130" y="504" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Check the publisher's age range, then read a</text>
<text x="130" y="533" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">page aloud. Short lines for toddlers, a longer</text>
<text x="130" y="562" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">story for ages 5 to 9.</text>
<rect x="16" y="617" width="668" height="72" rx="10" fill="#2b2620"/>
<text x="350" y="661" font-size="24" fill="#f6d64a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Then tell your own version alongside it.</text>
</svg>
