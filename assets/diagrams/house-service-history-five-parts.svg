<text x="114" y="186" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">when each was serviced</text>
<rect x="30" y="210" width="640" height="102" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
