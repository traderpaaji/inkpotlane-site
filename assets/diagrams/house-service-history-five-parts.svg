<text x="62" y="272" font-size="30" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="114" y="246" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Appliances</text>
<text x="114" y="278" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Make, model, serial number, install</text>
<text x="114" y="304" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">date, warranty and who to call</text>
<rect x="30" y="328" width="640" height="102" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
