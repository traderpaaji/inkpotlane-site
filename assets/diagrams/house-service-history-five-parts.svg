<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 688" width="700" height="688" role="img">
<title>A home maintenance log book keeps your house's service history in five parts: systems, appliances, paint and finishes, repairs and improvements, and the people to call.</title>
<desc>Five numbered rows. 1 Systems: roof, heating, water heater and wiring, and when each was serviced. 2 Appliances: make, model, serial number, install date, warranty and who to call. 3 Paint and finishes: brand, color and code for every room. 4 Repairs and improvements: what was done, when, by whom and what it cost. 5 The people: the plumber who turned up, the electrician and roofer you trust.</desc>
<rect width="700" height="688" fill="#fbf8f2"/>
<text x="350" y="52" font-size="27" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A house's service history, in five parts</text>
<rect x="30" y="92" width="640" height="102" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="30" y="92" width="64" height="102" rx="10" fill="#f2a03d" stroke="#2b2620" stroke-width="2"/>
