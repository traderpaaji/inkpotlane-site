<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" width="700" height="510" role="img">
<title>How to make a logic puzzle in five steps: choose the answer first, build the register of suspects, write clues that cut the list, run the two tests, then read every clue exactly and hand it to a fresh solver.</title>
<desc>Five numbered cards. 1: choose the answer first; in the example, Cora took the last mince pie. 2: build the register: eight suspects with the same three facts each. 3: write clues that cut the list, each true of the answer and false of someone still in play. 4: run the two tests: all the clues leave one name, and removing any clue lets someone back. 5: read it exactly, then hand it to a fresh solver.</desc>
<rect width="700" height="510" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">How to make a logic puzzle: five steps</text>
<rect x="40" y="70" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="105" r="20" fill="#4f2840"/>
<text x="80" y="112" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="118" y="100" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Choose the answer first</text>
<text x="118" y="125" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Ours: Cora took the last mince pie.</text>
<rect x="40" y="154" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="189" r="20" fill="#4f2840"/>
<text x="80" y="196" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="118" y="184" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Build the register</text>
<text x="118" y="209" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Eight suspects, the same three facts for each.</text>
<rect x="40" y="238" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="273" r="20" fill="#4f2840"/>
<text x="80" y="280" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="118" y="268" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Write clues that cut the list</text>
<text x="118" y="293" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Each one true of the answer, false of someone still in play.</text>
<rect x="40" y="322" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="357" r="20" fill="#4f2840"/>
<text x="80" y="364" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="118" y="352" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Run the two tests</text>
<text x="118" y="377" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">All clues leave one name; removing any clue lets someone back.</text>
<rect x="40" y="406" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="441" r="20" fill="#4f2840"/>
<text x="80" y="448" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">5</text>
<text x="118" y="436" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Read it exactly, then hand it over</text>
<text x="118" y="461" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Close the loopholes, then watch a fresh solver.</text>
</svg>
