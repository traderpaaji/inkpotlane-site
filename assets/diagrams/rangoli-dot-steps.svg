<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" width="700" height="760" role="img">
<title>An easy rangoli for kids in four steps: dots, a center circle, petals, then color.</title>
<desc>Four panels. 1: nine dots in three rows of three. 2: a circle drawn around the middle dot. 3: eight curved petals added, each starting from the circle and looping around one of the eight outer dots. 4: the petals filled in orange and red with a yellow center.</desc>
