<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 630" width="700" height="630" role="img">
<title>How to start copywork at home: six short steps for a first week, from choosing one sentence to writing one of your own.</title>
<desc>Six numbered steps. 1 Choose one sentence worth writing; start short, such as Well begun is half done. 2 Read it aloud together before a word is written. 3 Copy it slowly, on lines with a baseline and a midline, shown as three small ruled lines. 4 Check it letter by letter for a missed comma, a changed word or a capital. 5 Notice one thing, such as a comma that makes you pause or a strong verb. 6 Now and then, write one sentence of your own in the same shape. Above the steps: a pencil, lined paper and ten minutes.</desc>
<rect width="700" height="630" fill="#fbf8f2"/>
<text x="350.0" y="50.0" font-size="30" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A first week of copywork</text>
<text x="350.0" y="84.0" font-size="22" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">a pencil, lined paper and ten minutes</text>
<rect x="24.0" y="108.0" width="652.0" height="74.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="64.0" cy="145.0" r="21" fill="#b8323a"/><text x="64.0" y="152.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="104.0" y="140.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Choose one sentence worth writing</text>
<text x="104.0" y="169.0" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Start short: “Well begun is half done.”</text>
<rect x="24.0" y="194.0" width="652.0" height="74.0" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="64.0" cy="231.0" r="21" fill="#2b2620"/><text x="64.0" y="238.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="104.0" y="226.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Read it aloud together</text>
<text x="104.0" y="255.0" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">before a word is written</text>
<rect x="24.0" y="280.0" width="652.0" height="74.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="64.0" cy="317.0" r="21" fill="#2b2620"/><text x="64.0" y="324.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="104.0" y="312.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Copy it slowly</text>
<text x="104.0" y="341.0" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">on lines with a baseline and a midline</text>
<rect x="24.0" y="366.0" width="652.0" height="74.0" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="64.0" cy="403.0" r="21" fill="#2b2620"/><text x="64.0" y="410.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="104.0" y="398.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Check it letter by letter</text>
<text x="104.0" y="427.0" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">a missed comma, a changed word, a capital</text>
<rect x="24.0" y="452.0" width="652.0" height="74.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="64.0" cy="489.0" r="21" fill="#2b2620"/><text x="64.0" y="496.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">5</text>
<text x="104.0" y="484.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Notice one thing</text>
<text x="104.0" y="513.0" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">a comma that makes you pause, a strong verb</text>
<rect x="24.0" y="538.0" width="652.0" height="74.0" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="64.0" cy="575.0" r="21" fill="#b8323a"/><text x="64.0" y="582.9" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">6</text>
<text x="104.0" y="570.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Now and then, write one of your own</text>
<text x="104.0" y="599.0" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">one sentence in the same shape</text>
<line x1="520" y1="296" x2="650" y2="296" stroke="#d9d1c3" stroke-width="2"/>
<line x1="520" y1="314" x2="650" y2="314" stroke="#bfb5a5" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="520" y1="336" x2="650" y2="336" stroke="#2b2620" stroke-width="2"/>
</svg>
