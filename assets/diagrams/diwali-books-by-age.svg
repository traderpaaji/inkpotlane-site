<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 544" width="700" height="544" role="img">
<title>Diwali books for kids, arranged by age: board books, picture books, longer stories and activity books.</title>
<desc>A bookshelf of Diwali books for kids, arranged by age in four columns. Ages 2 to 4: board books, point and name. Ages 3 to 6: picture books, one family's Diwali read aloud. Ages 5 to 9: longer stories, such as Rama and Sita, a first Diwali far from home, and how the world celebrates. Ages 4 to 8: activity books, for the afternoon after the story.</desc>
