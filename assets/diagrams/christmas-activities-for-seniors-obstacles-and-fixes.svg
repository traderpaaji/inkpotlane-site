<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 618" width="700" height="618" role="img">
<title>Christmas activities for seniors made easier: each week's small obstacle and its simple fix, from shaky handwriting to dark roads.</title>
<desc>A four-row table, one row per week. Week 1: handwriting isn't as steady as it was; fix: one line per card, a thicker pen, the card flat on a tray. Week 2: the box is heavy and the tree is tall; fix: box to a chair, the sitter chooses and the stander hangs. Week 3: nobody ever measured anything; fix: measure each handful as you go and write it down. Week 4: dark roads, cold air and late nights; fix: go at dusk, keep the route short, best view to the passenger.</desc>
<rect width="700" height="618" fill="#fbf8f2"/>
<text x="350.0" y="50.0" font-size="30" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">One small obstacle, one simple fix</text>
<text x="108.0" y="104.0" font-size="24" fill="#6b6358" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The obstacle</text>
<text x="400.0" y="104.0" font-size="24" fill="#b8323a" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The fix</text>
<rect x="18.0" y="122.0" width="664.0" height="123.8" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="64.0" y="152.0" font-size="20" fill="#6b6358" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">WEEK</text>
<text x="64.0" y="188.0" font-size="34" fill="#b8323a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<path d="M 378 174.9 L 390 183.9 L 378 192.9 Z" fill="#f2a03d"/>
<text x="108.0" y="158.0" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Handwriting isn't as steady</text>
<text x="108.0" y="186.6" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">as it was</text>
<text x="400.0" y="158.0" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">One line per card, a</text>
<text x="400.0" y="186.6" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">thicker pen, the card flat</text>
<text x="400.0" y="215.2" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">on a tray</text>
<rect x="18.0" y="257.8" width="664.0" height="95.2" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="64.0" y="287.8" font-size="20" fill="#6b6358" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">WEEK</text>
<text x="64.0" y="323.8" font-size="34" fill="#b8323a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<path d="M 378 296.4 L 390 305.4 L 378 314.4 Z" fill="#f2a03d"/>
<text x="108.0" y="293.8" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">The box is heavy and the</text>
<text x="108.0" y="322.4" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">tree is tall</text>
<text x="400.0" y="293.8" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Box to a chair: the sitter</text>
<text x="400.0" y="322.4" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">chooses, the stander hangs</text>
<rect x="18.0" y="365.0" width="664.0" height="95.2" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="64.0" y="395.0" font-size="20" fill="#6b6358" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">WEEK</text>
<text x="64.0" y="431.0" font-size="34" fill="#b8323a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<path d="M 378 403.6 L 390 412.6 L 378 421.6 Z" fill="#f2a03d"/>
<text x="108.0" y="401.0" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Nobody ever measured</text>
<text x="108.0" y="429.6" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">anything</text>
<text x="400.0" y="401.0" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Measure each handful as</text>
<text x="400.0" y="429.6" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">you go and write it down</text>
<rect x="18.0" y="472.2" width="664.0" height="123.8" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="64.0" y="502.2" font-size="20" fill="#6b6358" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">WEEK</text>
<text x="64.0" y="538.2" font-size="34" fill="#b8323a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<path d="M 378 525.1 L 390 534.1 L 378 543.1 Z" fill="#f2a03d"/>
<text x="108.0" y="508.2" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Dark roads, cold air and</text>
<text x="108.0" y="536.8" font-size="22" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">late nights</text>
<text x="400.0" y="508.2" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Go at dusk, keep the route</text>
<text x="400.0" y="536.8" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">short, best view to the</text>
<text x="400.0" y="565.4" font-size="22" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">passenger</text>
</svg>
