<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img">
<title>The reindeer names in The Night Before Christmas: six have stayed the same since 1823, while Dunder and Blixem became Donder and Blitzen, then Donner and Blitzen.</title>
<desc>Six name tags: Dasher, Dancer, Prancer, Vixen, Comet and Cupid, named the same in 1823 as today. Below, the last pair changing in three steps with arrows: 1823 printing, Dunder and Blixem, close to Dutch words for thunder and lightning; Moore's Poems, 1844, Donder and Blitzen, with Blitzen borrowed from German, not Dutch; later printings, Donner and Blitzen, the names most people say today.</desc>
<rect width="700" height="700" fill="#fbf8f2"/>
<text x="350" y="48" font-size="26" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Named the same in 1823 as today</text>
<rect x="30" y="76" width="204" height="58" rx="29" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<path d="M 56 112 l 5 -12 l 5 12 l -13 -8 h 16 z" fill="#f2a03d"/>
<text x="142" y="114" font-size="25" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Dasher</text>
<rect x="248" y="76" width="204" height="58" rx="29" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<path d="M 274 112 l 5 -12 l 5 12 l -13 -8 h 16 z" fill="#f2a03d"/>
<text x="360" y="114" font-size="25" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Dancer</text>
<rect x="466" y="76" width="204" height="58" rx="29" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<path d="M 492 112 l 5 -12 l 5 12 l -13 -8 h 16 z" fill="#f2a03d"/>
<text x="578" y="114" font-size="25" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Prancer</text>
<rect x="30" y="150" width="204" height="58" rx="29" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<path d="M 56 186 l 5 -12 l 5 12 l -13 -8 h 16 z" fill="#f2a03d"/>
<text x="142" y="188" font-size="25" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Vixen</text>
<rect x="248" y="150" width="204" height="58" rx="29" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<path d="M 274 186 l 5 -12 l 5 12 l -13 -8 h 16 z" fill="#f2a03d"/>
<text x="360" y="188" font-size="25" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Comet</text>
<rect x="466" y="150" width="204" height="58" rx="29" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<path d="M 492 186 l 5 -12 l 5 12 l -13 -8 h 16 z" fill="#f2a03d"/>
<text x="578" y="188" font-size="25" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Cupid</text>
<text x="350" y="264" font-size="26" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The last pair changed</text>
<rect x="30" y="290" width="640" height="104" rx="10" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/>
<text x="54" y="330" font-size="22" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">1823 printing</text>
<text x="54" y="372" font-size="28" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Dunder and Blixem</text>
<text x="370" y="330" font-size="21" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">close to Dutch words for</text>
<text x="370" y="357" font-size="21" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">thunder and lightning</text>
<path d="M 350 396 v 10 m -10 -10 l 10 12 l 10 -12" fill="none" stroke="#2b2620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="422" width="640" height="104" rx="10" fill="#fde9cc" stroke="#d9d1c3" stroke-width="2"/>
<text x="54" y="462" font-size="22" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Moore's Poems, 1844</text>
<text x="54" y="504" font-size="28" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Donder and Blitzen</text>
<text x="370" y="462" font-size="21" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Blitzen borrowed from</text>
<text x="370" y="489" font-size="21" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">German, not Dutch</text>
<path d="M 350 528 v 10 m -10 -10 l 10 12 l 10 -12" fill="none" stroke="#2b2620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="554" width="640" height="104" rx="10" fill="#f6d9d6" stroke="#d9d1c3" stroke-width="2"/>
<text x="54" y="594" font-size="22" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Later printings</text>
<text x="54" y="636" font-size="28" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Donner and Blitzen</text>
<text x="370" y="594" font-size="21" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">the names most people</text>
<text x="370" y="621" font-size="21" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">say today</text>
</svg>
