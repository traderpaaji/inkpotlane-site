<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img">
<title>Three logic gates and their truth tables: AND is ON only when both inputs are ON; OR is ON when at least one input is ON; NOT flips its one input.</title>
<desc>Three truth tables. AND, both on: inputs 0 0 give 0, 0 1 give 0, 1 0 give 0, 1 1 give 1. OR, at least one on: 0 0 give 0, 0 1 give 1, 1 0 give 1, 1 1 give 1. NOT, flips it: 0 gives 1, 1 gives 0. A note: 1 means on, 0 means off, and the rows that give on are shaded.</desc>
