<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img">
<title>A blank grid for the three-house puzzle: columns for the left, middle and right houses, rows for color, pet and drink.</title>
<desc>An empty three by three grid. The columns are headed Left, Middle and Right; the rows are labelled Color, Pet and Drink. A note lists the options: colors red, blue, green; pets cat, dog, fish; drinks tea, milk, juice. All squares are empty.</desc>
<rect width="700" height="380" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A blank grid for the three-house puzzle</text>
<rect x="170" y="80" width="160" height="44" rx="0" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="250" y="109" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Left</text>
<rect x="330" y="80" width="160" height="44" rx="0" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="410" y="109" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Middle</text>
<rect x="490" y="80" width="160" height="44" rx="0" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="570" y="109" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Right</text>
<text x="154" y="161" font-size="19" fill="#2b2620" text-anchor="end" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Color</text>
<rect x="170" y="124" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<rect x="330" y="124" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<rect x="490" y="124" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<text x="154" y="221" font-size="19" fill="#2b2620" text-anchor="end" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Pet</text>
<rect x="170" y="184" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<rect x="330" y="184" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<rect x="490" y="184" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<text x="154" y="281" font-size="19" fill="#2b2620" text-anchor="end" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Drink</text>
<rect x="170" y="244" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<rect x="330" y="244" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<rect x="490" y="244" width="160" height="60" rx="0" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<text x="350" y="356" font-size="15" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Colors: red, blue, green. Pets: cat, dog, fish. Drinks: tea, milk, juice.</text>
</svg>
