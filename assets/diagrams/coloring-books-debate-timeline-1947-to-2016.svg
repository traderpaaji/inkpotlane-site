<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 798" width="700" height="798" role="img">
<title>The coloring book debate from 1947 to 2016: Lowenfeld's claim, the search for its proof, and a study of coloring and calm.</title>
<desc>A vertical timeline with four dates. 1947: Viktor Lowenfeld's textbook Creative and Mental Growth calls coloring books detrimental to children's creative expression. 1991: I. L. King publishes In Search of Lowenfeld's Proof That Coloring Books Are Harmful to Children. 2005: Curry and Kasser, with 84 college students, find coloring a mandala or a plaid pattern eased anxiety more than free coloring on a blank sheet. 2016: a public radio report finds the case against coloring books still rests on argument, not experiments with children.</desc>
