<line x1="80" y1="70" x2="80" y2="626" stroke="#d9d1c3" stroke-width="4"/>
<circle cx="80" cy="70" r="46" fill="#f2a03d" stroke="#2b2620" stroke-width="3"/>
<text x="80" y="79" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1947</text>
<text x="150" y="74" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Viktor Lowenfeld's textbook, Creative and</text>
<text x="150" y="106" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Mental Growth, calls coloring books</text>
<text x="150" y="138" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">detrimental to children's creative</text>
<text x="150" y="170" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">expression.</text>
<circle cx="80" cy="266" r="46" fill="#d9d1c3" stroke="#2b2620" stroke-width="3"/>
<text x="80" y="275" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1991</text>
<text x="150" y="270" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">I. L. King publishes “In Search of</text>
<text x="150" y="302" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Lowenfeld's Proof That Coloring Books Are</text>
<text x="150" y="334" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Harmful to Children.”</text>
<circle cx="80" cy="430" r="46" fill="#f6d64a" stroke="#2b2620" stroke-width="3"/>
<text x="80" y="439" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2005</text>
<text x="150" y="434" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Curry and Kasser, 84 college students:</text>
<text x="150" y="466" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">coloring a mandala or a plaid pattern</text>
<text x="150" y="498" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">eased anxiety more than free coloring on a</text>
<text x="150" y="530" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">blank sheet.</text>
<circle cx="80" cy="626" r="46" fill="#d9d1c3" stroke="#2b2620" stroke-width="3"/>
<text x="80" y="635" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2016</text>
<text x="150" y="630" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A public radio report finds the case</text>
<text x="150" y="662" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">against coloring books still rests on</text>
<text x="150" y="694" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">argument, not on experiments with</text>
<text x="150" y="726" font-size="24" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">children.</text>
