<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" width="700" height="760" role="img">
<title>How to make a paper lantern for Diwali in four steps: fold the paper, cut slits to a pencil line, roll it into a tube, then add a handle.</title>
<desc>Four panels. 1: a rectangle of colored paper folded in half the long way, the bottom half brought up, so the fold runs along the bottom. 2: slits cut from the fold toward the open edge, each stopping at a dashed pencil line an inch from the edge. 3: the paper opened out and rolled into a tube with the slits running up and down, so the strips bulge outward. 4: the finished lantern with a paper strip glued across the top as a handle, hanging from a string.</desc>
