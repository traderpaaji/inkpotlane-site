<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 925" width="700" height="925" role="img">
<title>How to use a planner in 15 minutes on a Sunday evening: big goal, quarter goals, three big rocks, ten-minute steps, one top priority a day, then habits.</title>
<desc>A vertical timeline from 7:30 to 7:45. First a box: before the timer, 2 minutes looking back: wins, one line of gratitude, sleep, energy and mood, a brain dump, and next week's one thing. Then six bars sized by minutes: minutes 1 to 2, look at your big goal; minutes 3 to 4, check the quarter's 3 goals; minutes 5 to 7, choose 3 big rocks; minutes 8 to 10, add ten-minute steps; minutes 11 to 13, one top priority per day; minutes 14 to 15, set up habits, 3 at most. At 7:45: timer off, the week is planned.</desc>
<rect width="700" height="925" fill="#fbf8f2"/>
<text x="350.0" y="46.0" text-anchor="middle" font-size="27" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">A 15-minute Sunday planning routine</text>
<rect x="30.0" y="76.0" width="640.0" height="112.0" rx="10" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/>
<text x="52.0" y="112.0" text-anchor="start" font-size="23" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Before the timer: 2 minutes looking back</text>
<text x="52.0" y="146.0" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Wins, one line of gratitude, sleep, energy, mood,</text>
<text x="52.0" y="176.0" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">a brain dump, and next week's one thing</text>
<text x="60.0" y="222.0" text-anchor="middle" font-size="23" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">7:30</text>
<rect x="42" y="236" width="60" height="80" fill="#f6d64a" stroke="#2b2620" stroke-width="2"/>
<text x="72.0" y="284.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">2</text>
<line x1="102" y1="236" x2="670" y2="236" stroke="#d9d1c3" stroke-width="1"/>
<text x="130.0" y="272.0" text-anchor="start" font-size="22" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Minutes 1-2</text>
<text x="130.0" y="302.0" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Look at your big goal</text>
<rect x="42" y="316" width="60" height="80" fill="#f9e7a8" stroke="#2b2620" stroke-width="2"/>
<text x="72.0" y="364.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">2</text>
<line x1="102" y1="316" x2="670" y2="316" stroke="#d9d1c3" stroke-width="1"/>
<text x="130.0" y="352.0" text-anchor="start" font-size="22" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Minutes 3-4</text>
<text x="130.0" y="382.0" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Check the quarter's 3 goals</text>
<rect x="42" y="396" width="60" height="120" fill="#f2a03d" stroke="#2b2620" stroke-width="2"/>
<text x="72.0" y="464.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">3</text>
<line x1="102" y1="396" x2="670" y2="396" stroke="#d9d1c3" stroke-width="1"/>
<text x="130.0" y="452.0" text-anchor="start" font-size="22" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Minutes 5-7</text>
<text x="130.0" y="482.0" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Choose 3 big rocks</text>
<rect x="42" y="516" width="60" height="120" fill="#f6c27e" stroke="#2b2620" stroke-width="2"/>
<text x="72.0" y="584.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">3</text>
<line x1="102" y1="516" x2="670" y2="516" stroke="#d9d1c3" stroke-width="1"/>
<text x="130.0" y="572.0" text-anchor="start" font-size="22" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Minutes 8-10</text>
<text x="130.0" y="602.0" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Add ten-minute steps</text>
<rect x="42" y="636" width="60" height="120" fill="#e58a8f" stroke="#2b2620" stroke-width="2"/>
<text x="72.0" y="704.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">3</text>
<line x1="102" y1="636" x2="670" y2="636" stroke="#d9d1c3" stroke-width="1"/>
<text x="130.0" y="692.0" text-anchor="start" font-size="22" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Minutes 11-13</text>
<text x="130.0" y="722.0" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">One top priority per day</text>
<rect x="42" y="756" width="60" height="80" fill="#f2c4c6" stroke="#2b2620" stroke-width="2"/>
<text x="72.0" y="804.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">2</text>
<line x1="102" y1="756" x2="670" y2="756" stroke="#d9d1c3" stroke-width="1"/>
<text x="130.0" y="792.0" text-anchor="start" font-size="22" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Minutes 14-15</text>
<text x="130.0" y="822.0" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Set up habits, 3 at most</text>
<line x1="102" y1="836" x2="670" y2="836" stroke="#d9d1c3" stroke-width="1"/>
<text x="60.0" y="868.0" text-anchor="middle" font-size="23" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">7:45</text>
<text x="130.0" y="868.0" text-anchor="start" font-size="23" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Timer off. The week is planned.</text>
<text x="130.0" y="902.0" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">Each bar is drawn to its length in minutes.</text>
</svg>
