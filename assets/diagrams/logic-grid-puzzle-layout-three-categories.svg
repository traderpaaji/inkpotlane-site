<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img">
<title>How a logic grid puzzle is laid out: three categories of four things make three small grids of 16 squares, 48 in all, marked X for no and a tick for yes.</title>
<desc>A blank logic grid for a puzzle about neighbors, pies and arrival times. Three small 4 by 4 grids share edges in an L shape: neighbors against pies at the top left, neighbors against arrival times at the top right, and arrival times against pies underneath. Notes beside it read: 3 categories of 4 things each, 3 small grids of 16 squares each, 48 squares in all. Each square asks whether this goes with that. A legend shows an X meaning no and a tick meaning yes.</desc>
<rect width="700" height="560" fill="#fbf8f2"/>
<text x="188.0" y="88.0" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Pies</text>
<text x="372.0" y="88.0" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Arrival times</text>
<text x="64.0" y="202.0" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif" transform="rotate(-90 64 202.0)">Neighbors</text>
<text x="64.0" y="386.0" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif" transform="rotate(-90 64 386.0)">Arrival times</text>
