<text x="310" y="217" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">w</text>
<circle cx="310" cy="250" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="310" y="257" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">y</text>
<circle cx="310" cy="290" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="310" y="297" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">p</text>
<text x="310" y="336" font-size="14" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">column 3</text>
<circle cx="420" cy="90" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="420" y="97" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">v</text>
<circle cx="420" cy="130" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="420" y="137" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">b</text>
<circle cx="420" cy="170" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="420" y="177" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">g</text>
<circle cx="420" cy="210" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="420" y="217" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">k</text>
<circle cx="420" cy="250" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="420" y="257" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">q</text>
