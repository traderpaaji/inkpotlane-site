<text x="200" y="297" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">u</text>
<text x="200" y="336" font-size="14" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">column 2</text>
<circle cx="310" cy="90" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
