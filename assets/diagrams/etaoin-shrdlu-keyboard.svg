<text x="200" y="137" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">h</text>
<circle cx="200" cy="170" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="200" y="177" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">r</text>
<circle cx="200" cy="210" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="200" y="217" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">d</text>
<circle cx="200" cy="250" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="200" y="257" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">l</text>
