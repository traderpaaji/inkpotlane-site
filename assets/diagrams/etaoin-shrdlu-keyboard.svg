<text x="420" y="336" font-size="14" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">column 4</text>
<circle cx="530" cy="90" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="530" y="97" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">x</text>
<circle cx="530" cy="130" r="17" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="530" y="137" font-size="20" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">z</text>
<text x="530" y="336" font-size="14" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">column 5</text>
</svg>
