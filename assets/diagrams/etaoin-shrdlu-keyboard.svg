<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img">
<title>The lowercase letter keys on a Linotype keyboard, in columns from the left: e t a o i n, then s h r d l u, then c m f w y p, v b g k q j, and x z. Running a finger down the first two columns spells etaoin shrdlu.</title>
<desc>Five columns of round keys. Column 1, highlighted: e, t, a, o, i, n. Column 2, highlighted: s, h, r, d, l, u. Column 3: c, m, f, w, y, p. Column 4: v, b, g, k, q, j. Column 5: x, z.</desc>
<rect width="700" height="360" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The left side of a Linotype keyboard, lowercase</text>
<circle cx="90" cy="90" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="90" y="97" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">e</text>
<circle cx="90" cy="130" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="90" y="137" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">t</text>
<circle cx="90" cy="170" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="90" y="177" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">a</text>
<circle cx="90" cy="210" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="90" y="217" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">o</text>
<circle cx="90" cy="250" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="90" y="257" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">i</text>
<circle cx="90" cy="290" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="90" y="297" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">n</text>
<text x="90" y="336" font-size="14" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">column 1</text>
<circle cx="200" cy="90" r="17" fill="#f6ecf1" stroke="#4f2840" stroke-width="2"/>
<text x="200" y="97" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">s</text>
