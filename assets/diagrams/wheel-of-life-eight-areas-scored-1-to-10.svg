<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img">
<title>One eight-area version of the wheel of life: health, money, work or study, relationships, growth, fun, home and purpose, each scored from 1 at the center to 10 at the rim.</title>
<desc>A circle divided into eight equal slices with ten faint rings. In this version, the slices are health, money, work or study, relationships, growth, fun, home and purpose. Markers on the top spoke show 1 near the center, 5 halfway and 10 at the rim. A heading says: score each area from 1 to 10.</desc>
<rect width="700" height="700" fill="#fbf8f2"/>
<circle cx="350" cy="370" r="200" fill="#ffffff"/>
<circle cx="350.0" cy="370.0" r="20.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="40.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="60.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="80.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="100.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="120.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="140.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="160.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="180.0" fill="none" stroke="#d9d1c3" stroke-width="1.2"/>
<circle cx="350.0" cy="370.0" r="200.0" fill="none" stroke="#2b2620" stroke-width="3"/>
<line x1="350.0" y1="370.0" x2="350.0" y2="170.0" stroke="#6b6358" stroke-width="1.5"/>
<line x1="350.0" y1="370.0" x2="491.4" y2="228.6" stroke="#6b6358" stroke-width="1.5"/>
<line x1="350.0" y1="370.0" x2="550.0" y2="370.0" stroke="#6b6358" stroke-width="1.5"/>
<line x1="350.0" y1="370.0" x2="491.4" y2="511.4" stroke="#6b6358" stroke-width="1.5"/>
<line x1="350.0" y1="370.0" x2="350.0" y2="570.0" stroke="#6b6358" stroke-width="1.5"/>
<line x1="350.0" y1="370.0" x2="208.6" y2="511.4" stroke="#6b6358" stroke-width="1.5"/>
<line x1="350.0" y1="370.0" x2="150.0" y2="370.0" stroke="#6b6358" stroke-width="1.5"/>
<line x1="350.0" y1="370.0" x2="208.6" y2="228.6" stroke="#6b6358" stroke-width="1.5"/>
<text x="350.0" y="48.0" text-anchor="middle" font-size="27" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Score each area from 1 to 10</text>
<text x="435.7" y="161.1" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Health</text>
<text x="556.9" y="293.3" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Money</text>
<text x="556.9" y="450.7" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Work or</text>
<text x="556.9" y="478.7" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">study</text>
<text x="435.7" y="598.9" text-anchor="start" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Relationships</text>
<text x="264.3" y="598.9" text-anchor="end" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Growth</text>
<text x="143.1" y="464.7" text-anchor="end" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Fun</text>
<text x="143.1" y="293.3" text-anchor="end" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Home</text>
<text x="264.3" y="161.1" text-anchor="end" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Purpose</text>
<circle cx="350" cy="350.0" r="18" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
<text x="350.0" y="357.0" text-anchor="middle" font-size="20" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">1</text>
<circle cx="350" cy="270.0" r="18" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
<text x="350.0" y="277.0" text-anchor="middle" font-size="20" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">5</text>
<circle cx="350" cy="170.0" r="18" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
<text x="350.0" y="177.0" text-anchor="middle" font-size="20" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">10</text>
<text x="350.0" y="686.0" text-anchor="middle" font-size="23" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-style="italic">1 at the center, 10 at the rim</text>
</svg>
