<text x="420" y="466" font-size="20" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Mark X for no</text>
<text x="420" y="496" font-size="20" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">and a tick for yes.</text>
<text x="420" y="536" font-size="20" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Each row and column</text>
<text x="420" y="566" font-size="20" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">ends with one tick.</text>
