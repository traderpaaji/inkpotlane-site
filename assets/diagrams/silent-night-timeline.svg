<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 636" width="700" height="636" role="img">
<title>Silent Night, from poem to New York: Mohr's poem in 1816, Gruber's melody and the first performance on 24 December 1818, the first printing in 1833, New York in 1839, Gruber's own account in 1854 and John Freeman Young's English version in 1859.</title>
<desc>A vertical timeline of seven dated entries. 1816: Joseph Mohr writes the six-verse poem Stille Nacht at Mariapfarr. 1817: Mohr moves to St. Nicholas, Oberndorf, and meets Franz Xaver Gruber. 24 December 1818: Gruber sets it for two voices, choir and guitar, and it is sung that night. 1832 to 1833: Tyrolean singers take it to Leipzig, and its first printing in Dresden names no poet or composer. 1839: the Rainer family sing it in New York. 1854: Gruber writes his account, answering an inquiry from Berlin. 1859: John Freeman Young's three-verse English version is published in New York.</desc>
<rect width="700" height="636" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Silent Night, from poem to New York</text>
<rect x="40" y="70" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="105" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1816</text>
<text x="166" y="92" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Joseph Mohr writes the six-verse poem “Stille Nacht”</text>
<text x="166" y="114" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">while assistant priest at Mariapfarr, in Salzburg's Lungau region.</text>
<line x1="95" y1="126" x2="95" y2="148" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="148" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="183" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1817</text>
<text x="166" y="170" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Mohr moves to the new parish of St. Nicholas, Oberndorf,</text>
<text x="166" y="192" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">and meets the teacher and organist Franz Xaver Gruber.</text>
<line x1="95" y1="204" x2="95" y2="226" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="226" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="261" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">24 Dec 1818</text>
<text x="166" y="248" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Gruber sets the poem for two voices, choir and guitar,</text>
<text x="166" y="270" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">and it is sung that night at St. Nicholas.</text>
<line x1="95" y1="282" x2="95" y2="304" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="304" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="339" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1832-33</text>
<text x="166" y="326" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Tyrolean singers carry it to Leipzig; its first printing</text>
<text x="166" y="348" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">in Dresden names no poet and no composer.</text>
<line x1="95" y1="360" x2="95" y2="382" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="382" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="417" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1839</text>
<text x="166" y="404" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">The Rainer family sing it in New York:</text>
<text x="166" y="426" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">the first known American performance.</text>
<line x1="95" y1="438" x2="95" y2="460" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="460" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="495" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1854</text>
<text x="166" y="482" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Gruber writes his account of how the song began,</text>
<text x="166" y="504" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">answering an inquiry from Berlin.</text>
<line x1="95" y1="516" x2="95" y2="538" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="538" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="573" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1859</text>
<text x="166" y="560" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">John Freeman Young's English version, three verses,</text>
<text x="166" y="582" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">is published in New York.</text>
</svg>
