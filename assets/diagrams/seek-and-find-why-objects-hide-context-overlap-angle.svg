<text x="123.0" y="290" text-anchor="middle" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Context</text>
<text x="123.0" y="360" text-anchor="middle" font-size="21" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">among things that</text>
<text x="123.0" y="390" text-anchor="middle" font-size="21" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">look like they belong</text>
<text x="350.0" y="290" text-anchor="middle" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Overlap</text>
<text x="350.0" y="360" text-anchor="middle" font-size="21" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">half behind</text>
<text x="350.0" y="390" text-anchor="middle" font-size="21" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">something else</text>
<text x="577.0" y="290" text-anchor="middle" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Angle</text>
<text x="577.0" y="360" text-anchor="middle" font-size="21" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">turned sideways</text>
<text x="577.0" y="390" text-anchor="middle" font-size="21" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">or lying down</text>
<text x="350" y="446" text-anchor="middle" font-size="23" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-style="italic">The object is not small, and it is not in disguise.</text>
