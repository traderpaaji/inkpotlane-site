<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img">
<title>Why objects are hard to find in a seek and find picture: context, overlap and angle, not tiny size.</title>
<desc>Three panels, each with the hidden object ringed in orange. Context: a rolling pin lying among other long, pale, wooden shapes. Overlap: a teacup half behind a stack of books, with only its side and handle showing. Angle: a ladder lying on its side instead of standing upright. A line underneath reads: the object is not small, and it is not in disguise.</desc>
