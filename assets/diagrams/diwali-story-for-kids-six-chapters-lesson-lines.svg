<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="700" height="850" role="img">
<title>The Diwali story for kids in six short chapters, each with a lesson line to say aloud, from a promise kept to the lamps of Ayodhya.</title>
<desc>A column of six numbered chapters joined by a dotted line, the last marked with a small lit lamp. 1 The prince who kept a promise: a promise kept is a kind of light. 2 The golden deer: not everything that sparkles is what it seems. 3 Hanuman's great leap: a true friend is brave for you. 4 The bridge of stones: many small hands can cross an ocean. 5 Light over darkness: stand up for what is right, even when it takes courage. 6 The lamps of Ayodhya: when someone you love is coming home, light the way.</desc>
