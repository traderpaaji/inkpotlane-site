<rect x="528" y="256" width="34" height="40" rx="3" fill="#ffffff" stroke="#b8323a" stroke-width="2"/>
<rect x="128" y="500" width="140" height="150" rx="6" fill="#f1ebe1" stroke="#5f7a5c" stroke-width="2"/>
<text x="198" y="524" font-size="16" fill="#5f7a5c" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Area 3</text>
