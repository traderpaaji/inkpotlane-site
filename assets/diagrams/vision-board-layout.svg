<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" width="700" height="820" role="img">
<title>A 16 x 20 vision board laid out before gluing: a word of the year at the top, one big anchor picture in the middle, a cluster of pictures, words and an object for each of four life areas in the corners, and a goal with a date on each side of the anchor.</title>
<desc>A portrait board drawn as a rectangle. Across the top, a band reading Word of the year. In the middle, a large square marked Anchor, one big picture. In each of the four corners, a shaded zone labelled Area 1 to Area 4, each holding two pictures, a strip of words and a small object. Either side of the anchor, a goal label with a date tag beneath it, reading By June 2027 and By Dec 31. A legend shows picture, words, object and date. A note says to leave gaps, since how many pieces fit depends on their size, and to leave gaps so it can be read at a glance.</desc>
<rect width="700" height="820" fill="#fbf8f2"/>
<text x="350" y="38" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A 16 x 20 board, laid out before you glue</text>
<rect x="110" y="70" width="480" height="600" rx="4" fill="#fbf6ee" stroke="#2b2620" stroke-width="3"/>
<rect x="250" y="90" width="200" height="44" rx="4" fill="#b5623f" stroke="#b5623f" stroke-width="2"/>
<text x="350" y="120" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">WORD OF THE YEAR</text>
