<text x="350" y="396" font-size="20" fill="#b5623f" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">ANCHOR</text>
<text x="350" y="422" font-size="16" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">one big picture</text>
