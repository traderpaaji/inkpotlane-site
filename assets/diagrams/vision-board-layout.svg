<text x="124" y="716" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">picture</text>
<rect x="230" y="700" width="26" height="20" rx="3" fill="#f2a03d" stroke="#f2a03d" stroke-width="2"/>
