<text x="350" y="770" font-size="17" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Leave gaps: how many pieces fit depends on their size.</text>
<text x="350" y="796" font-size="17" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">a board you can read at a glance is one you keep reading.</text>
