<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img">
<title>New year goals on four dates: a December evening to look back and choose one goal, Monday 4 January 2027 to start small, Sunday 31 January for a fifteen-minute check, and Wednesday 31 March for a quarter review.</title>
<desc>Four date cards in a row, joined by arrows. A December evening: look back at 2026, choose one goal, write it as something to do, not to stop. Monday 4 January 2027: start with the smallest step, ten minutes, today. Sunday 31 January 2027: a fifteen-minute check; adjust the plan, keep the goal. Wednesday 31 March 2027: quarter review; push a few, keep some ticking, pause the rest. A note says to put all four in the diary before the year starts.</desc>
<rect width="700" height="400" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">New year goals: four dates, four small jobs</text>
<rect x="30" y="70" width="148" height="290" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="30" y="70" width="148" height="72" rx="8" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="104" y="100" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A December</text>
<text x="104" y="125" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">evening</text>
<text x="104" y="180" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Look back at 2026.</text>
<text x="104" y="210" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Choose one goal.</text>
<text x="104" y="240" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Write it to do,</text>
<text x="104" y="270" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">not to stop.</text>
<path d="M 182 215 L 192 225 L 182 235 Z" fill="#f2a03d"/>
<rect x="194" y="70" width="148" height="290" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="194" y="70" width="148" height="72" rx="8" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="268" y="100" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Mon 4 Jan</text>
<text x="268" y="125" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">2027</text>
<text x="268" y="180" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Start with the</text>
<text x="268" y="210" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">smallest step:</text>
<text x="268" y="240" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">ten minutes,</text>
<text x="268" y="270" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">today.</text>
<path d="M 346 215 L 356 225 L 346 235 Z" fill="#f2a03d"/>
<rect x="358" y="70" width="148" height="290" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="358" y="70" width="148" height="72" rx="8" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="432" y="100" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Sun 31 Jan</text>
<text x="432" y="125" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">2027</text>
<text x="432" y="180" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Fifteen-minute</text>
<text x="432" y="210" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">check. Adjust</text>
<text x="432" y="240" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">the plan,</text>
<text x="432" y="270" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">keep the goal.</text>
<path d="M 510 215 L 520 225 L 510 235 Z" fill="#f2a03d"/>
<rect x="522" y="70" width="148" height="290" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="522" y="70" width="148" height="72" rx="8" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="596" y="100" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Wed 31 Mar</text>
<text x="596" y="125" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">2027</text>
<text x="596" y="180" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Quarter review:</text>
<text x="596" y="210" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">push a few,</text>
<text x="596" y="240" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">keep some ticking,</text>
<text x="596" y="270" font-size="15" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">pause the rest.</text>
<text x="350" y="388" font-size="16" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Put all four in the diary before the year starts.</text>
</svg>
