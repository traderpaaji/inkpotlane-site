<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
<title>How a story-linked cozy mystery word search differs from unrelated puzzles: each solved grid adds another line to the continuing mystery.</title>
