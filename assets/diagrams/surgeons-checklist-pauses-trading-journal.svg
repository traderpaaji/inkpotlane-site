<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 660" width="700" height="660" role="img">
<title>A comparison between the WHO Surgical Safety Checklist's pauses and a trading journal's plan-and-result layout.</title>
<desc>Two timelines. Top: the surgical checklist's three pauses, before anesthesia, before the first incision and before the patient leaves the room. An arrow points to a trading journal below, with a PLAN row before a trade and a RESULT row afterward. A note says the comparison is about when the checks are written.</desc>
<rect width="700" height="660" fill="#fbf8f2"/>
<text x="30" y="50" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">In the operating room: three pauses</text>
<line x1="60" y1="100" x2="640" y2="100" stroke="#d9d1c3" stroke-width="4"/>
<circle cx="120" cy="100" r="20" fill="#f6d64a" stroke="#2b2620" stroke-width="3"/>
<text x="120" y="108" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="120" y="156" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Before</text>
<text x="120" y="185" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">anesthesia</text>
<circle cx="350" cy="100" r="20" fill="#f6d64a" stroke="#2b2620" stroke-width="3"/>
<text x="350" y="108" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="350" y="156" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Before the</text>
<text x="350" y="185" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">first incision</text>
<circle cx="580" cy="100" r="20" fill="#f6d64a" stroke="#2b2620" stroke-width="3"/>
<text x="580" y="108" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="580" y="156" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Before the</text>
<text x="580" y="185" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">patient leaves</text>
<text x="580" y="214" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">the room</text>
<text x="350" y="300" font-size="23" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">The shape to borrow</text>
<line x1="350" y1="314" x2="350" y2="342" stroke="#6b6358" stroke-width="3"/><path d="M 350 352 L 342 340 L 358 340 Z" fill="#6b6358"/>
<text x="30" y="400" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">In a trading journal: two rows per trade</text>
<rect x="30" y="432" width="220" height="130" rx="10" fill="#ffffff" stroke="#2b2620" stroke-width="3"/>
<text x="140" y="474" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">PLAN row</text>
<text x="140" y="506" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">sign-in, before</text>
<text x="140" y="536" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">the trade</text>
<line x1="256" y1="497" x2="284" y2="497" stroke="#2b2620" stroke-width="3"/><path d="M 294 497 L 282 489 L 282 505 Z" fill="#2b2620"/>
<rect x="300" y="457" width="100" height="80" rx="10" fill="#f2a03d" stroke="#2b2620" stroke-width="2"/>
<text x="350" y="492" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">the</text>
<text x="350" y="518" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">trade</text>
<line x1="406" y1="497" x2="434" y2="497" stroke="#2b2620" stroke-width="3"/><path d="M 444 497 L 432 489 L 432 505 Z" fill="#2b2620"/>
<rect x="450" y="432" width="220" height="130" rx="10" fill="#ffffff" stroke="#2b2620" stroke-width="3"/>
<text x="560" y="474" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">RESULT row</text>
<text x="560" y="506" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">sign-out, after</text>
<text x="560" y="536" font-size="22" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">the trade</text>
<text x="350" y="610" font-size="22" fill="#b8323a" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">The comparison is about when the checks are written:</text>
<text x="350" y="640" font-size="22" fill="#b8323a" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">one before the trade, one after it.</text>
</svg>
