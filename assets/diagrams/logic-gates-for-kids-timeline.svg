<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" role="img">
<title>From logic on paper to logic in wires: Boole's books of 1847 and 1854, Peirce's 1886 letter on switching circuits, 1930s work on switching circuit theory, and Shannon's 1937 thesis, published 1938.</title>
<desc>A vertical timeline. 1847: George Boole, The Mathematical Analysis of Logic, the first of his works on symbolic logic. 1854: Boole, The Laws of Thought, the algebra of true and false that gates follow. 1886: Charles Sanders Peirce, in a letter, says logic could be done by electrical switching circuits. The 1930s: Nakashima, Shannon and Shestakov each work on a theory of switching circuits. 1937: Claude Shannon's MIT master's thesis shows Boolean algebra simplifies relay circuits, published 1938.</desc>
