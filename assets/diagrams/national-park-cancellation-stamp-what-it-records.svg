<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img">
<title>What a national park cancellation stamp records: the park or stamp location name and the date of your visit, like a postmark for a place.</title>
<desc>A plain red ink ring, drawn as an example rather than a real stamp. Around the top of the ring runs PARK OR LOCATION NAME; across the center, between two ruled lines, is MONTH DAY YEAR. Labels point to them: the park or stamp location name, set in a ring of ink; the date of your visit, set by hand, so it can vary. A note reads: like a postmark, one place, one day.</desc>
