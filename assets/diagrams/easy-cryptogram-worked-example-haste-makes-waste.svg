<title>An easy cryptogram for beginners solved step by step: the code QRXBN JRUNX FRXBN cracks in four moves to the proverb HASTE MAKES WASTE.</title>
<desc>Six rows show the same three code words being solved. Row 1, the code: QRXBN JRUNX FRXBN. Row 2, free letters N equals E and B equals T: ? ? ? T E, ? ? ? E ?, ? ? ? T E. Row 3, move 1: the code again with the ending RXBN highlighted in words 1 and 3, so they rhyme. Row 4, move 2, X equals S: ? ? S T E, ? ? ? E S, ? ? S T E. Row 5, move 3, R equals A: ? A S T E, ? A ? E S, ? A S T E. Row 6, move 4, Q equals H, J equals M, U equals K, F equals W: HASTE MAKES WASTE. Newly found letters are highlighted in yellow in each row.</desc>
