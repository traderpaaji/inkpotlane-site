<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640" role="img">
<title>How a cozy mystery word search hides its story: after you circle every word, the leftover letters read in order spell one line of the mystery.</title>
<desc>A word search grid of 8 by 6 squares drawn without letters. Nine found words are ringed with rounded outlines running across, down and diagonally, and their squares are shaded grey. Nine squares no word uses are shaded yellow and numbered 1 to 9 in reading order. An arrow leads to the same nine yellow squares in a row. The steps read: 1, find and circle every word; 2, some letters are left over; 3, read in order: one line of the story.</desc>
