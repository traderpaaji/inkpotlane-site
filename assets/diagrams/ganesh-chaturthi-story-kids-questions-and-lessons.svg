<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 818" width="700" height="818" role="img">
<title>The Ganesh Chaturthi story for kids told as a string of questions, in story order, each with its own small lesson.</title>
<desc>A numbered list of nine children's questions about Ganesha, each with a lesson line under it: 1 Where did Ganesha come from? What we make with love carries a little of us. 2 Why wouldn't the boy let Shiva in? A promise kept is the first form of strength. 3 Why does Bappa have an elephant's head? Wisdom, memory and strength. 4 Why do we pray to Ganesha first? He clears the road before you set out. 5 Why does such a big god ride a tiny mouse? Something small can still carry something great. 6 Why does Bappa love modaks so much? Wisdom is sweetest when you look inside. 7 Why does Bappa have a big belly? Hold big feelings and still stay calm and kind. 8 Why does Bappa have one broken tusk? Great things sometimes ask for a little sacrifice. 9 Why do we have to say goodbye to Bappa? Everything comes and goes; love stays.</desc>
<rect width="700" height="818" fill="#fbf8f2"/>
<text x="350.0" y="46.0" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The story, one question at a time</text>
<text x="350.0" y="76.0" font-size="22" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">each answer ends with a small lesson</text>
<rect x="18.0" y="96.0" width="664.0" height="70.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="131.0" r="19" fill="#b8323a"/><text x="52.0" y="138.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="86.0" y="126.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Where did Ganesha come from?</text>
<text x="86.0" y="154.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">What we make with love carries a little of us.</text>
<rect x="18.0" y="174.0" width="664.0" height="70.0" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="209.0" r="19" fill="#f2a03d"/><text x="52.0" y="216.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="86.0" y="204.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why wouldn't the boy let Shiva in?</text>
<text x="86.0" y="232.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">A promise kept is the first form of strength.</text>
<rect x="18.0" y="252.0" width="664.0" height="70.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="287.0" r="19" fill="#b8323a"/><text x="52.0" y="294.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="86.0" y="282.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why does Bappa have an elephant's head?</text>
<text x="86.0" y="310.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Wisdom, memory and strength.</text>
<rect x="18.0" y="330.0" width="664.0" height="70.0" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="365.0" r="19" fill="#f2a03d"/><text x="52.0" y="372.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="86.0" y="360.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why do we pray to Ganesha first?</text>
<text x="86.0" y="388.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">He clears the road before you set out.</text>
<rect x="18.0" y="408.0" width="664.0" height="70.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="443.0" r="19" fill="#b8323a"/><text x="52.0" y="450.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">5</text>
<text x="86.0" y="438.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why does such a big god ride a tiny mouse?</text>
<text x="86.0" y="466.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Something small can still carry something great.</text>
<rect x="18.0" y="486.0" width="664.0" height="70.0" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="521.0" r="19" fill="#f2a03d"/><text x="52.0" y="528.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">6</text>
<text x="86.0" y="516.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why does Bappa love modaks so much?</text>
<text x="86.0" y="544.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Wisdom is sweetest when you look inside.</text>
<rect x="18.0" y="564.0" width="664.0" height="70.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="599.0" r="19" fill="#b8323a"/><text x="52.0" y="606.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">7</text>
<text x="86.0" y="594.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why does Bappa have a big belly?</text>
<text x="86.0" y="622.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Hold big feelings and still stay calm and kind.</text>
<rect x="18.0" y="642.0" width="664.0" height="70.0" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="677.0" r="19" fill="#f2a03d"/><text x="52.0" y="684.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">8</text>
<text x="86.0" y="672.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why does Bappa have one broken tusk?</text>
<text x="86.0" y="700.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Great things sometimes ask for a little sacrifice.</text>
<rect x="18.0" y="720.0" width="664.0" height="70.0" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<circle cx="52.0" cy="755.0" r="19" fill="#b8323a"/><text x="52.0" y="762.6" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">9</text>
<text x="86.0" y="750.0" font-size="23" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Why do we have to say goodbye to Bappa?</text>
<text x="86.0" y="778.0" font-size="21" fill="#6b6358" text-anchor="start" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Everything comes and goes; love stays.</text>
</svg>
