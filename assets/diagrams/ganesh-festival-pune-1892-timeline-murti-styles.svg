<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 831" width="700" height="831" role="img">
<title>A timeline of one account of Pune's public Ganesh festival: the Rangari tradition dates Bhausaheb Rangari's public Ganesha to 1892, Tilak praised public celebrations in Kesari in 1893, and neighborhood mandals expanded afterward.</title>
<desc>A five-step timeline of one account of Pune's public Ganesh festival. A traditional account says Krishnajipant Khasgiwale saw public Ganesha celebrations in Gwalior and shared the idea in Pune. By the Rangari Trust's account, Bhausaheb Rangari installed a public Ganesha in 1892; other accounts give a later year. In 1893 Lokmanya Tilak praised public celebrations in Kesari. Neighborhood mandals later spread in Pune and beyond, with communities developing different murti styles.</desc>
<rect width="700" height="831" fill="#fbf8f2"/>
<text x="350.0" y="50.0" font-size="30" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">How Pune took Ganesha public</text>
<text x="350.0" y="82.0" font-size="22" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">and why murti styles multiplied</text>
<line x1="118" y1="146" x2="118" y2="727" stroke="#d9d1c3" stroke-width="4"/>
<circle cx="118" cy="146.0" r="11" fill="#f2a03d" stroke="#2b2620" stroke-width="3"/>
<text x="96.0" y="154.0" font-size="21" fill="#6b6358" text-anchor="end" font-family="Georgia, 'Times New Roman', serif">Before</text>
<circle cx="118" cy="305.1" r="11" fill="#b8323a" stroke="#2b2620" stroke-width="3"/>
<text x="96.0" y="313.1" font-size="24" fill="#b8323a" text-anchor="end" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1892</text>
<circle cx="118" cy="464.2" r="11" fill="#b8323a" stroke="#2b2620" stroke-width="3"/>
<text x="96.0" y="472.2" font-size="24" fill="#b8323a" text-anchor="end" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1893</text>
<circle cx="118" cy="596.0" r="11" fill="#f2a03d" stroke="#2b2620" stroke-width="3"/>
<text x="96.0" y="604.0" font-size="21" fill="#6b6358" text-anchor="end" font-family="Georgia, 'Times New Roman', serif">Then</text>
<circle cx="118" cy="727.8" r="11" fill="#f2a03d" stroke="#2b2620" stroke-width="3"/>
<text x="96.0" y="735.8" font-size="21" fill="#6b6358" text-anchor="end" font-family="Georgia, 'Times New Roman', serif">Over time</text>
<rect x="152.0" y="112.0" width="534.0" height="141.1" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="168.0" y="142.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A visit to Gwalior</text>
<text x="168.0" y="175.2" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Krishnajipant Khasgiwale sees Ganesha celebrated in</text>
<text x="168.0" y="202.5" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">public and shares the idea with Balasaheb Natu and</text>
<text x="168.0" y="229.8" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Bhausaheb Rangari.</text>
<rect x="152.0" y="271.1" width="534.0" height="141.1" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="168.0" y="301.1" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Bappa steps outside the home</text>
<text x="168.0" y="334.3" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">By the Rangari Trust's account, Rangari installs a</text>
<text x="168.0" y="361.6" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">public Ganesha in his Pune wada; other accounts give</text>
<text x="168.0" y="388.9" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">a later year.</text>
<rect x="152.0" y="430.2" width="534.0" height="113.8" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="168.0" y="460.2" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A newspaper takes it up</text>
<text x="168.0" y="493.4" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Lokmanya Tilak praises the public festival in Kesari</text>
<text x="168.0" y="520.7" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">and encourages communities to organize their own.</text>
<rect x="152.0" y="562.0" width="534.0" height="113.8" rx="8" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="168.0" y="592.0" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Neighborhood mandals form</text>
<text x="168.0" y="625.2" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">The idea spreads to other towns across Maharashtra</text>
<text x="168.0" y="652.5" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">and, over time, to other parts of India.</text>
<rect x="152.0" y="693.8" width="534.0" height="113.8" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="168.0" y="723.8" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Every street its own Bappa</text>
<text x="168.0" y="757.0" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Each mandal decides how its murti looks, so Ganpati</text>
<text x="168.0" y="784.3" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">murti styles multiply.</text>
</svg>
