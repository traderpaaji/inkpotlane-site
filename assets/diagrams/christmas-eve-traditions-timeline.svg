<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 558" width="700" height="558" role="img">
<title>Milestones in Christmas Eve traditions: stockings pictured in a New York St. Nicholas print in 1810, the poem first printed in 1823, milk and cookies for Santa popular in America from the 1930s, Iceland's book catalog from 1944, the Santa tracker from 1955, and your own family's tradition from this year.</title>
<desc>A vertical timeline of six entries. 1810: a New York St. Nicholas print shows two stockings beside a fireplace. 1823: A Visit from St. Nicholas is first printed and carries the stockings scene to a wide audience. 1930s: milk and cookies for Santa take off in America; older roots are suggested but unproven. 1944: Iceland's yearly catalog of new books begins, part of its Christmas book culture. 1955: a wrong-number call to a military base on 30 November starts the Santa tracker NORAD still runs. This year: your own family's tradition starts the first time you do it.</desc>
<rect width="700" height="558" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Christmas Eve traditions: some milestones</text>
<rect x="40" y="70" width="96" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="88" y="105" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1810</text>
<text x="152" y="92" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A New York St. Nicholas print shows two stockings</text>
<text x="152" y="114" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">hanging beside a fireplace.</text>
<line x1="88" y1="126" x2="88" y2="148" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="148" width="96" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="88" y="183" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1823</text>
<text x="152" y="170" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">“A Visit from St. Nicholas” is first printed and</text>
<text x="152" y="192" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">carries the stockings scene to a wide audience.</text>
<line x1="88" y1="204" x2="88" y2="226" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="226" width="96" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="88" y="261" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1930s</text>
<text x="152" y="248" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Milk and cookies for Santa take off in America</text>
<text x="152" y="270" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">(older roots are suggested, but unproven).</text>
<line x1="88" y1="282" x2="88" y2="304" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="304" width="96" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="88" y="339" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1944</text>
<text x="152" y="326" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Iceland's yearly catalog of new books begins,</text>
<text x="152" y="348" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">part of its Christmas book culture.</text>
<line x1="88" y1="360" x2="88" y2="382" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="382" width="96" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="88" y="417" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1955</text>
<text x="152" y="404" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A wrong-number call to a military base, 30 Nov,</text>
<text x="152" y="426" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">starts the Santa tracker NORAD still runs.</text>
<line x1="88" y1="438" x2="88" y2="460" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="460" width="96" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="88" y="495" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">This year</text>
<text x="152" y="482" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Your own family's tradition starts the first time</text>
<text x="152" y="504" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">you do it, and becomes one the second.</text>
</svg>
