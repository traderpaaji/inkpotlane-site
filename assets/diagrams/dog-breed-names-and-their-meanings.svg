<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 702" width="700" height="702" role="img">
<title>What dog breed names mean: Dachshund is badger dog, Papillon is butterfly, Basset is low, and more breed names traced to the words behind them.</title>
<desc>A table of eight dog breed names and the words behind them. Named for the work: Dachshund, badger dog, from German Dachs plus Hund; Terrier, earth, from Latin terra through French; Poodle, to splash, from German Pudel and Low German puddeln. Named for the look: Papillon, butterfly, French; Schnauzer, snout or muzzle, from German Schnauze; Basset, low, from French bas; Shih Tzu, lion, Chinese; Borzoi, fast or swift, Russian.</desc>
<rect width="700" height="702" fill="#fbf8f2"/>
<rect x="14" y="14" width="672" height="48" rx="8" fill="#2b2620"/>
<text x="34" y="47" text-anchor="start" font-size="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Named for the work</text>
<rect x="14" y="62" width="672" height="70" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="106" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Dachshund</text>
<line x1="214" y1="97.0" x2="256" y2="97.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 97.0 L 250 85.0 L 250 109.0 Z" fill="#f2a03d"/>
<text x="290" y="94" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“badger dog”</text>
<text x="290" y="120" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">German: Dachs + Hund</text>
<rect x="14" y="132" width="672" height="70" rx="0" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="176" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Terrier</text>
<line x1="214" y1="167.0" x2="256" y2="167.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 167.0 L 250 155.0 L 250 179.0 Z" fill="#f2a03d"/>
<text x="290" y="164" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“earth”</text>
<text x="290" y="190" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">Latin terra, through French</text>
<rect x="14" y="202" width="672" height="70" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="246" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Poodle</text>
<line x1="214" y1="237.0" x2="256" y2="237.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 237.0 L 250 225.0 L 250 249.0 Z" fill="#f2a03d"/>
<text x="290" y="234" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“to splash”</text>
<text x="290" y="260" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">German Pudel, Low German puddeln</text>
<rect x="14" y="288" width="672" height="48" rx="8" fill="#2b2620"/>
<text x="34" y="321" text-anchor="start" font-size="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Named for the look</text>
<rect x="14" y="336" width="672" height="70" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="380" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Papillon</text>
<line x1="214" y1="371.0" x2="256" y2="371.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 371.0 L 250 359.0 L 250 383.0 Z" fill="#f2a03d"/>
<text x="290" y="368" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“butterfly”</text>
<text x="290" y="394" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">French</text>
<rect x="14" y="406" width="672" height="70" rx="0" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="450" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Schnauzer</text>
<line x1="214" y1="441.0" x2="256" y2="441.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 441.0 L 250 429.0 L 250 453.0 Z" fill="#f2a03d"/>
<text x="290" y="438" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“snout” or “muzzle”</text>
<text x="290" y="464" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">German: Schnauze</text>
<rect x="14" y="476" width="672" height="70" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="520" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Basset</text>
<line x1="214" y1="511.0" x2="256" y2="511.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 511.0 L 250 499.0 L 250 523.0 Z" fill="#f2a03d"/>
<text x="290" y="508" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“low”</text>
<text x="290" y="534" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">French: bas</text>
<rect x="14" y="546" width="672" height="70" rx="0" fill="#f3ede2" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="590" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Shih Tzu</text>
<line x1="214" y1="581.0" x2="256" y2="581.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 581.0 L 250 569.0 L 250 593.0 Z" fill="#f2a03d"/>
<text x="290" y="578" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“lion”</text>
<text x="290" y="604" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">Chinese</text>
<rect x="14" y="616" width="672" height="70" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1"/>
<text x="34" y="660" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Borzoi</text>
<line x1="214" y1="651.0" x2="256" y2="651.0" stroke="#f2a03d" stroke-width="5" stroke-linecap="round"/><path d="M 270 651.0 L 250 639.0 L 250 663.0 Z" fill="#f2a03d"/>
<text x="290" y="648" text-anchor="start" font-size="25" fill="#b8323a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">“fast” or “swift”</text>
<text x="290" y="674" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">Russian</text>
</svg>
