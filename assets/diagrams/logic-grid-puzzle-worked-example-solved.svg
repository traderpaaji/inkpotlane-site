<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" width="700" height="760" role="img">
<title>A worked logic grid puzzle, solved: Mabel brought the cherry pie at 10:00, Otis the apple pie at 9:00 and Priya the pumpkin pie at 9:30.</title>
<desc>A solved logic grid with three small 3 by 3 grids. Rows list the neighbors Mabel, Otis and Priya, then the times 9:00, 9:30 and 10:00; columns list the pies apple, cherry and pumpkin, then the times. Each row and column of each small grid has one tick on a yellow square and X's everywhere else. Ticks: Mabel with cherry and 10:00, Otis with apple and 9:00, Priya with pumpkin and 9:30, and the apple pie at 9:00, the pumpkin pie at 9:30 and the cherry pie at 10:00. Three cards below repeat the answer: Mabel, cherry, 10:00; Otis, apple, 9:00; Priya, pumpkin, 9:30.</desc>
