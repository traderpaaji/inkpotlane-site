<text x="175.0" y="428.0" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Plain on the outside</text>
<text x="175.0" y="458.0" font-size="21" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">steamed, shaped like a teardrop</text>
