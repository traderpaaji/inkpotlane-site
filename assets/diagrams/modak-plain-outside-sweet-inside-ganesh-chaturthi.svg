<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img">
<title>A steamed ukadiche modak, traditionally associated with Ganesha: a pleated rice-flour dumpling with a coconut-and-jaggery filling.</title>
<desc>Two drawings of a steamed ukadiche modak. Left, the whole pointed, pleated dumpling with a rice-flour outer shell. Right, the modak cut open to show a coconut-and-jaggery filling. A note underneath reads: Wisdom, like a modak, is sweetest when you look inside.</desc>
<rect width="700" height="560" fill="#fbf8f2"/>
<text x="350.0" y="50.0" font-size="30" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">What is inside a modak?</text>
