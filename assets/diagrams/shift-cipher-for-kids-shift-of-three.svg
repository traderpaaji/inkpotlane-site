<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img">
<title>A shift cipher for kids with a shift of three: each letter of the message is written as the letter three places further along the alphabet.</title>
<desc>Two alphabet strips, shown in two rows of thirteen letters. The top strip, labelled Code, reads D to Z and then A, B, C. The strip under it, labelled Plain, reads A to Z, so code D sits over plain A, E over B, and so on; the D over A pair is highlighted. Below, the plain message LOOK UNDER YOUR PILLOW is shown with its code, ORRN XQGHU BRXU SLOORZ.</desc>
<rect width="700" height="470" fill="#fbf8f2"/>
<text x="350" y="42" text-anchor="middle" font-size="22" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">Shift of three: slide the plain strip until its A sits under D</text>
