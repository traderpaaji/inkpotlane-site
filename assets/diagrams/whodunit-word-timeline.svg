<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" role="img">
<title>The word whodunit, as the record shows it: Van Dine's rules 1928, Knox's rules 1929, Donald Gordon's 1930 review (the earliest known use), the Detection Club 1930, and the later Variety claims of 1934-35.</title>
<desc>A vertical timeline with five entries. 1928: Van Dine's Twenty Rules for Writing Detective Stories in The American Magazine. 1929: Ronald Knox's Ten Rules for a Good Detective Story in Publishers Weekly, 5 October. 1930: Donald Gordon uses whodunit in a News of Books review of Half-Mast Murder, the earliest known use. 1930: British crime writers form the Detection Club, whose members agreed to follow Knox's rules. 1934 to 35: a Variety headline of 28 August 1934, and Wolfe Kaufman's later claim to have coined the word around 1935.</desc>
<rect width="700" height="480" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The word “whodunit”: what the record shows</text>
<rect x="40" y="70" width="104" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="92" y="105" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1928</text>
<text x="160" y="92" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Van Dine's “Twenty Rules for Writing Detective</text>
<text x="160" y="114" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Stories” appears in The American Magazine.</text>
<line x1="92" y1="126" x2="92" y2="148" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="148" width="104" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="92" y="183" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1929</text>
<text x="160" y="170" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Ronald Knox's “Ten Rules for a Good Detective</text>
<text x="160" y="192" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Story” (Publishers Weekly, 5 October).</text>
<line x1="92" y1="204" x2="92" y2="226" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="226" width="104" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="92" y="261" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1930</text>
<text x="160" y="248" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Donald Gordon uses “whodunit” in a News of Books</text>
<text x="160" y="270" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">review of Half-Mast Murder: earliest known use.</text>
<line x1="92" y1="282" x2="92" y2="304" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="304" width="104" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="92" y="339" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1930</text>
<text x="160" y="326" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">British crime writers form the Detection Club,</text>
<text x="160" y="348" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">whose members agreed to follow Knox's rules.</text>
<line x1="92" y1="360" x2="92" y2="382" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="382" width="104" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="92" y="417" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1934-35</text>
<text x="160" y="404" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">The word in Variety: a headline of 28 Aug 1934;</text>
<text x="160" y="426" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Wolfe Kaufman later claimed he coined it c. 1935.</text>
