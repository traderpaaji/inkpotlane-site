<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640" role="img">
<title>What happened to Ohtani's goal chart: only the Nippon-Ham Fighters selected him in the first round of the 2012 NPB draft, while he did reach the 160 km/h fastball target that summer.</title>
<desc>Two rows compare the chart with later events. Main goal: first-round nominations from eight teams. On 25 October 2012, only the Nippon-Ham Fighters picked him in the first round, marked missed. Speed goal: 160 km/h. On 19 July 2012, he threw 160 km/h in an Iwate prefecture semifinal, marked came true.</desc>
<rect width="700" height="640" fill="#fbf8f2"/>
<text x="170.0" y="50.0" text-anchor="middle" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">On the chart</text>
<text x="530.0" y="50.0" text-anchor="middle" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">What happened</text>
<rect x="30.0" y="80.0" width="280.0" height="210.0" rx="10" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/>
<text x="170.0" y="148.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Main goal: first-</text>
<text x="170.0" y="182.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">round nominations</text>
<text x="170.0" y="216.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">from eight teams</text>
<line x1="318.0" y1="185.0" x2="384.0" y2="185.0" stroke="#2b2620" stroke-width="3" stroke-linecap="round"/><path d="M 384.0 185.0 L 371.4 191.1 L 371.4 178.9 Z" fill="#2b2620"/>
<rect x="390.0" y="80.0" width="280.0" height="210.0" rx="10" fill="#ffffff" stroke="#b8323a" stroke-width="3"/>
<text x="530.0" y="132.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">25 October 2012:</text>
<text x="530.0" y="162.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">one team picked him</text>
<text x="530.0" y="192.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">in the first round,</text>
<text x="530.0" y="222.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">the Nippon-Ham Fighters</text>
<rect x="450.0" y="246.0" width="160.0" height="34.0" rx="17" fill="#b8323a" stroke="#b8323a" stroke-width="1"/>
<text x="530.0" y="271.0" text-anchor="middle" font-size="21" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Missed</text>
<rect x="30.0" y="320.0" width="280.0" height="210.0" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="170.0" y="388.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Support:</text>
<text x="170.0" y="422.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">speed of</text>
<text x="170.0" y="456.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">160 km/h</text>
<line x1="318.0" y1="425.0" x2="384.0" y2="425.0" stroke="#2b2620" stroke-width="3" stroke-linecap="round"/><path d="M 384.0 425.0 L 371.4 431.1 L 371.4 418.9 Z" fill="#2b2620"/>
<rect x="390.0" y="320.0" width="280.0" height="210.0" rx="10" fill="#ffffff" stroke="#4f7f7a" stroke-width="3"/>
<text x="530.0" y="372.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">19 July 2012:</text>
<text x="530.0" y="402.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">he threw 160 km/h</text>
<text x="530.0" y="432.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">(99 mph) in an Iwate</text>
<text x="530.0" y="462.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">prefecture semifinal</text>
<rect x="450.0" y="486.0" width="160.0" height="34.0" rx="17" fill="#4f7f7a" stroke="#4f7f7a" stroke-width="1"/>
<text x="530.0" y="511.0" text-anchor="middle" font-size="21" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Came true</text>
<text x="350.0" y="588.0" text-anchor="middle" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-style="italic">The center is a direction;</text>
<text x="350.0" y="622.0" text-anchor="middle" font-size="25" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the squares are the work.</text>
</svg>
