<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 685" width="700" height="685" role="img">
<title>Three kinds of Ganpati murti style names: forms from the old texts, regional crafts, and modern pandal themes.</title>
<desc>Three cards. First, from the old texts, established iconographic traditions: Vakratunda, Heramba, Nritya Ganapati and Maha Ganapati. Second, from regional crafts, regional materials and visual influences: Cuttack silver filigree and Gujarati mirror work. Third, modern pandal themes, useful labels for what you see rather than ancient categories: a fort-inspired Bappa and a space-themed Bappa.</desc>
