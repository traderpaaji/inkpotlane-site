<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 636" width="700" height="636" role="img">
<title>From a relief train to a Christmas tree: the Halifax Explosion on 6 December 1917, the governor's reply at 11 a.m., the relief train leaving Boston at 10 p.m., its arrival through a blizzard on 8 December, the reported thank-you tree of 1918, the yearly gift from 1971, and the 2026 lighting on 3 December.</title>
<desc>A vertical timeline of seven entries. 6 December 1917: soon after 9 a.m. the Mont-Blanc explodes in Halifax harbor, and Boston hears by telegraph within the hour. 11 a.m.: Governor McCall wires Halifax that Massachusetts stands ready to go the limit. 10 p.m.: a relief train of doctors, nurses and supplies leaves Boston, about 13 hours after the explosion. 8 December 1917: slowed by a blizzard, the train reaches Halifax in the morning, and Boston holds a mass meeting at Faneuil Hall. 1918: Halifax is reported to have sent Boston a Christmas tree as a thank-you. 1971: Nova Scotia's tree for Boston becomes a yearly gift, later taken over by the province. 3 December 2026: this year's lighting on Boston Common, 6 to 8 p.m., the first Thursday after Thanksgiving.</desc>
<rect width="700" height="636" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">From a relief train to a Christmas tree</text>
<rect x="40" y="70" width="130" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="105" y="105" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">6 Dec 1917</text>
<text x="186" y="92" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Soon after 9 a.m. the Mont-Blanc explodes in</text>
<text x="186" y="114" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Halifax harbor. Boston hears by telegraph within the hour.</text>
<line x1="105" y1="126" x2="105" y2="148" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="148" width="130" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="105" y="183" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">11 a.m.</text>
<text x="186" y="170" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Governor McCall wires Halifax that Massachusetts</text>
<text x="186" y="192" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">stands ready "to go the limit."</text>
<line x1="105" y1="204" x2="105" y2="226" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="226" width="130" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="105" y="261" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">10 p.m.</text>
<text x="186" y="248" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A relief train of doctors, nurses and supplies</text>
<text x="186" y="270" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">leaves Boston, about 13 hours after the explosion.</text>
<line x1="105" y1="282" x2="105" y2="304" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="304" width="130" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="105" y="339" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">8 Dec 1917</text>
<text x="186" y="326" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Slowed by a blizzard, the train reaches Halifax</text>
<text x="186" y="348" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">in the morning. Boston meets at Faneuil Hall.</text>
<line x1="105" y1="360" x2="105" y2="382" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="382" width="130" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="105" y="417" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1918</text>
<text x="186" y="404" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Halifax is reported to have sent Boston a</text>
<text x="186" y="426" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Christmas tree as a thank-you.</text>
<line x1="105" y1="438" x2="105" y2="460" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="460" width="130" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="105" y="495" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1971</text>
<text x="186" y="482" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Nova Scotia's tree for Boston becomes a yearly gift;</text>
<text x="186" y="504" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">the province later takes it over.</text>
<line x1="105" y1="516" x2="105" y2="538" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="538" width="130" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="105" y="573" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3 Dec 2026</text>
<text x="186" y="560" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">This year's lighting on Boston Common,</text>
<text x="186" y="582" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">6 to 8 p.m., the first Thursday after Thanksgiving.</text>
</svg>
