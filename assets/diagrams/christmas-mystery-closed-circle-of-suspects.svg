<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" role="img">
<title>The closed circle of suspects behind many Christmas mysteries: a small group cut off in one place, so the culprit must be one of them.</title>
<desc>A large circle ringed with snowflakes holds six small circles, each marked with a question mark for a suspect. In the middle the words: the culprit must be one of them. Notes outside say snow closes the roads and nobody can walk away. Below: a limited group, isolated in one place: a remote house, an island or a train. Everyone who could have done it is already inside.</desc>
