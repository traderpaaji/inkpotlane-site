<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img">
<title>One example of choosing a word of the year: twenty candidates become ten after the Tuesday test, then four (simplify, focus, finish and enough) after looking back at the year, and simplify is the final choice. Your own counts and word will differ.</title>
<desc>A four-stage funnel showing one example. 20: write twenty in ten minutes, no judging. 10 remain after the Tuesday test: can you act on it on an ordinary day? 4 remain after asking what each word answers about last year: simplify, focus, finish and enough. 1: say it and picture it; simplify, because it answers a crowded year and brings a clear shelf to mind. A note says the counts are an example.</desc>
<rect width="700" height="470" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">From twenty words to one</text>
<rect x="40" y="70" width="620" height="80" rx="10" fill="#ffffff" stroke="#4f2840" stroke-width="2"/>
<text x="64" y="120" font-size="30" fill="#f2a03d" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">20</text>
<text x="120" y="104" font-size="18" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Write twenty in ten minutes</text>
<text x="120" y="130" font-size="14" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">no judging</text>
<rect x="70" y="166" width="560" height="80" rx="10" fill="#ffffff" stroke="#4f2840" stroke-width="2"/>
<text x="94" y="216" font-size="30" fill="#f2a03d" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">10</text>
<text x="150" y="200" font-size="18" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The Tuesday test</text>
<text x="150" y="226" font-size="14" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">can you act on it on an ordinary day?</text>
<rect x="100" y="262" width="500" height="80" rx="10" fill="#ffffff" stroke="#4f2840" stroke-width="2"/>
<text x="124" y="312" font-size="30" fill="#f2a03d" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="180" y="296" font-size="18" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">What does it answer?</text>
<text x="180" y="322" font-size="14" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">simplify, focus, finish, enough</text>
<rect x="130" y="358" width="440" height="80" rx="10" fill="#4f2840" stroke="#4f2840" stroke-width="2"/>
<text x="154" y="408" font-size="30" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="210" y="392" font-size="18" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Say it, picture it: SIMPLIFY</text>
<text x="210" y="418" font-size="14" fill="#ffffff" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">answers a crowded year; a clear shelf</text>
<text x="350" y="468" font-size="15" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Counts are an example; your list will cut differently.</text>
</svg>
