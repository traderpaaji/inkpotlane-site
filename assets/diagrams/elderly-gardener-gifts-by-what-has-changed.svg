<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 726" width="700" height="726" role="img">
<title>Gifts for elderly gardeners, sorted by what has changed: kneeling, grip, reach, small print or the quieter months in the garden.</title>
<desc>A two-column chart. Left, five things that may have changed for an older gardener; right, a gift that fits each. Kneeling or bending: a kneeler that turns over into a seat, or a low wheeled seat. Grip and weight: lighter tools with thick soft grips, long handles and gloves that fit. Reaching the soil: a raised bed, a table-height planter or containers by the door. Small print: plant labels written big, a notebook with wide lines and large-print books. Quieter months: a bird feeder in view, seed catalogs and a bulb on the windowsill. At the bottom: when in doubt, give time as well as a thing.</desc>
