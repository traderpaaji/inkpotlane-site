<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img">
<title>The cookie jar as two gates: B, nearly dinner time, goes through a NOT gate; A, homework finished, and NOT B go into an AND gate, which decides the cookie.</title>
<desc>A small circuit diagram made of boxes. A box A, homework finished, connects to an AND box. A box B, nearly dinner time, connects to a NOT box, which connects to the same AND box. The AND box connects to a green box, Cookie? A note: only one case gives a cookie, homework done and not nearly dinner.</desc>
<rect width="700" height="300" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The cookie jar: A AND (NOT B)</text>
<rect x="40" y="80" width="170" height="56" rx="8" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<text x="125" y="106" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A: homework</text>
<text x="125" y="126" font-size="15" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">finished</text>
<rect x="40" y="180" width="170" height="56" rx="8" fill="#ffffff" stroke="#2b2620" stroke-width="2"/>
<text x="125" y="206" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">B: nearly</text>
<text x="125" y="226" font-size="15" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">dinner time</text>
<rect x="260" y="180" width="110" height="56" rx="8" fill="#f6ecf1" stroke="#4f2840" stroke-width="3"/>
<text x="315" y="214" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">NOT</text>
<rect x="420" y="120" width="110" height="76" rx="8" fill="#f6ecf1" stroke="#4f2840" stroke-width="3"/>
<text x="475" y="165" font-size="20" fill="#4f2840" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">AND</text>
<rect x="570" y="128" width="100" height="60" rx="8" fill="#2f6f3a" stroke="#2f6f3a" stroke-width="2"/>
<text x="620" y="165" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Cookie?</text>
<line x1="210" y1="108" x2="420" y2="140" stroke="#2b2620" stroke-width="3"/>
<line x1="210" y1="208" x2="260" y2="208" stroke="#2b2620" stroke-width="3"/>
<line x1="370" y1="208" x2="420" y2="176" stroke="#2b2620" stroke-width="3"/>
<line x1="530" y1="158" x2="570" y2="158" stroke="#2b2620" stroke-width="3"/>
<text x="350" y="280" font-size="15" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Only one case gives a cookie: homework done, and not nearly dinner.</text>
</svg>
