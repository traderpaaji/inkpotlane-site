<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 558" width="700" height="558" role="img">
<title>The advent calendar, from chalk to cardboard: chalk marks and candles in the 1800s, a handmade wooden calendar in 1851, Gerhard Lang's printed calendars in 1908, the post-war licenses of 1945, fold-out doors by about 1950 and Swedish radio calendars from 1957.</title>
<desc>A vertical timeline of six dated entries. 1800s: German Lutheran families count down to Christmas with chalk marks on a wall or one candle a day. 1851: the earliest known handmade wooden calendar. 1908: Gerhard Lang of Reichhold and Lang in Munich is credited with mass-producing printed calendars. December 1945: Richard Sellmer of Stuttgart is licensed by the American occupation authorities to print 50,000 calendars. About 1950: fold-out doors have largely replaced tear-off sheets. 1957: Sweden's children's radio advent calendar begins; Denmark's follows in 1962.</desc>
<rect width="700" height="558" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The advent calendar, from chalk to cardboard</text>
<rect x="40" y="70" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="105" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1800s</text>
<text x="166" y="92" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">German Lutheran families count down to Christmas</text>
<text x="166" y="114" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">with chalk marks on a wall or one candle a day.</text>
<line x1="95" y1="126" x2="95" y2="148" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="148" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="183" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1851</text>
<text x="166" y="170" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">The earliest known handmade wooden calendar</text>
<text x="166" y="192" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">(Institute of Heraldic and Genealogical Studies).</text>
<line x1="95" y1="204" x2="95" y2="226" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="226" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="261" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1908</text>
<text x="166" y="248" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Gerhard Lang, Reichhold and Lang, Munich, is credited</text>
<text x="166" y="270" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">with mass-producing printed calendars.</text>
<line x1="95" y1="282" x2="95" y2="304" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="304" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="339" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Dec 1945</text>
<text x="166" y="326" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Richard Sellmer, Stuttgart, is licensed by the US</text>
<text x="166" y="348" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">occupation authorities to print 50,000 calendars.</text>
<line x1="95" y1="360" x2="95" y2="382" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="382" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="417" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c. 1950</text>
<text x="166" y="404" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Fold-out doors have largely replaced</text>
<text x="166" y="426" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">the tear-off sheets of the first post-war calendars.</text>
<line x1="95" y1="438" x2="95" y2="460" stroke="#d9d1c3" stroke-width="2"/>
<rect x="40" y="460" width="110" height="56" rx="6" fill="#eceef4" stroke="#2b2620" stroke-width="2"/>
<text x="95" y="495" font-size="17" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1957</text>
<text x="166" y="482" font-size="16" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Sweden's children's radio advent calendar begins;</text>
<text x="166" y="504" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Denmark's first follows in 1962.</text>
</svg>
