<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 684" width="700" height="684" role="img">
<title>Which group of cats words are in the dictionary: Merriam-Webster records clowder for a group of cats and litter for kittens, and no cat-group sense for the other popular terms.</title>
<desc>A checklist of eight words, asking whether Merriam-Webster records each as a word for a group of cats. Clowder: yes, its own entry, “a group of cats”. Litter: yes, for kittens, “the offspring at one birth”. Clutter: no cats, it is clowder's parent word, “a crowded or confused mass”. Kindle: no cat-group noun, only a verb, “to bring forth young”. Glaring: no cat-group sense, though Wiktionary lists a rare one. Pounce: no cats in its five entries, which cover a claw, the act of pouncing and a powder for ink. Cluster and nuisance: no, nothing feline recorded.</desc>
<rect width="700" height="684" fill="#fbf8f2"/>
<text x="350" y="40" text-anchor="middle" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Is it a word for a group of cats?</text>
<text x="350" y="72" text-anchor="middle" font-size="21" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Checked in Merriam-Webster</text>
<rect x="14" y="92" width="672" height="72" rx="0" fill="#fdecc8" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="136" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Clowder</text>
<circle cx="196" cy="128.0" r="20" fill="#f2a03d"/><path d="M 186 128.0 l 7 8 l 13 -16" fill="none" stroke="#2b2620" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="234" y="123" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Yes</text>
<text x="234" y="151" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">its own entry: “a group of cats”</text>
<rect x="14" y="164" width="672" height="72" rx="0" fill="#fdecc8" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="208" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Litter</text>
<circle cx="196" cy="200.0" r="20" fill="#f2a03d"/><path d="M 186 200.0 l 7 8 l 13 -16" fill="none" stroke="#2b2620" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="234" y="195" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Yes, for kittens</text>
<text x="234" y="223" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">“the offspring at one birth”</text>
<rect x="14" y="236" width="672" height="72" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="280" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Clutter</text>
<circle cx="196" cy="272.0" r="20" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/><path d="M 189 265.0 l 14 14 M 203 265.0 l -14 14" stroke="#6b6358" stroke-width="4" stroke-linecap="round"/>
<text x="234" y="267" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">No cats: clowder's parent word</text>
<text x="234" y="295" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">“a crowded or confused mass”</text>
<rect x="14" y="308" width="672" height="72" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="352" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Kindle</text>
<circle cx="196" cy="344.0" r="20" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/><path d="M 189 337.0 l 14 14 M 203 337.0 l -14 14" stroke="#6b6358" stroke-width="4" stroke-linecap="round"/>
<text x="234" y="339" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">No cat-group noun</text>
<text x="234" y="367" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">a verb: “to bring forth young”</text>
<rect x="14" y="380" width="672" height="72" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="424" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Glaring</text>
<circle cx="196" cy="416.0" r="20" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/><path d="M 189 409.0 l 14 14 M 203 409.0 l -14 14" stroke="#6b6358" stroke-width="4" stroke-linecap="round"/>
<text x="234" y="411" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">No cat-group sense</text>
<text x="234" y="439" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">Wiktionary lists a rare one</text>
<rect x="14" y="452" width="672" height="72" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="496" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Pounce</text>
<circle cx="196" cy="488.0" r="20" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/><path d="M 189 481.0 l 14 14 M 203 481.0 l -14 14" stroke="#6b6358" stroke-width="4" stroke-linecap="round"/>
<text x="234" y="483" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">No cats in its five entries</text>
<text x="234" y="511" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">a claw, the act of pouncing, a powder for ink</text>
<rect x="14" y="524" width="672" height="72" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="568" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Cluster</text>
<circle cx="196" cy="560.0" r="20" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/><path d="M 189 553.0 l 14 14 M 203 553.0 l -14 14" stroke="#6b6358" stroke-width="4" stroke-linecap="round"/>
<text x="234" y="555" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">No</text>
<text x="234" y="583" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">nothing feline recorded</text>
<rect x="14" y="596" width="672" height="72" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
<text x="34" y="640" text-anchor="start" font-size="26" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Nuisance</text>
<circle cx="196" cy="632.0" r="20" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/><path d="M 189 625.0 l 14 14 M 203 625.0 l -14 14" stroke="#6b6358" stroke-width="4" stroke-linecap="round"/>
<text x="234" y="627" text-anchor="start" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">No</text>
<text x="234" y="655" text-anchor="start" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">nothing feline recorded</text>
</svg>
