<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 558" width="700" height="558" role="img">
<title>The 20 Miss Marple short stories by first appearance: the Tuesday Night Club six (1927-28), the Bantry dinner six (1929-30), Death by Drowning (1931), The Thirteen Problems (1932), six later stories (1934-54, collected 1979) and Greenshaw's Folly (1956).</title>
<desc>A vertical timeline. 1927 to 28: stories 1 to 6, the Tuesday Night Club, in The Royal Magazine. 1929 to 30: stories 7 to 12, the dinner at the Bantrys', in The Story-Teller Magazine, and The Four Suspects first in the US Pictorial Review in January 1930. 1931: story 13, Death by Drowning, in Nash's Pall Mall Magazine. 1932: all 13 collected as The Thirteen Problems, called The Tuesday Club Murders in the US in 1933. 1934 to 54: six later stories, from a 1934 radio story to Sanctuary in 1954, collected in 1979. 1956: Greenshaw's Folly, the twentieth, in the Daily Mail, collected in 1960.</desc>
