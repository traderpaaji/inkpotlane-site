<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 466" width="700" height="466" role="img">
<title>Using etaoin shrdlu on a short cryptogram: count the code letters, treat the frequent ones as suspects from the top dozen, test them against word shapes, and leave letters with too little evidence open until the words decide.</title>
<desc>Four numbered cards. 1, Count: mark the three or four most frequent code letters. 2, Suspects, not answers: treat them as likely E, T, A, O, I, N, S, H, R, D, L, U. 3, Test word shapes: a three-letter word may be THE; one letter alone is A or I. 4, Leave doubtful letters open: a code letter seen once could stand for a common or a rare letter. Footnote: short puzzles wobble, and the top code letter is not always E.</desc>
<rect width="700" height="466" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Using etaoin shrdlu on a short cryptogram</text>
<rect x="40" y="70" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="105" r="20" fill="#1f5f63"/>
<text x="80" y="112" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="118" y="100" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Count</text>
<text x="118" y="125" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Mark the three or four most frequent code letters</text>
<rect x="40" y="154" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="189" r="20" fill="#1f5f63"/>
<text x="80" y="196" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="118" y="184" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Suspects, not answers</text>
<text x="118" y="209" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Treat them as likely E, T, A, O, I, N, S, H, R, D, L, U</text>
<rect x="40" y="238" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="273" r="20" fill="#1f5f63"/>
<text x="80" y="280" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="118" y="268" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Test word shapes</text>
<text x="118" y="293" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A three-letter word may be THE; one letter alone is A or I</text>
<rect x="40" y="322" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="357" r="20" fill="#1f5f63"/>
<text x="80" y="364" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="118" y="352" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Leave doubtful letters open</text>
<text x="118" y="377" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A code letter seen once could be common or rare</text>
<text x="350" y="424" font-size="16" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Short puzzles wobble: the top code letter is not always E.</text>
</svg>
