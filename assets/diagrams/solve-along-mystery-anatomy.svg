<line x1="257" y1="255" x2="210" y2="255" stroke="#f2a03d" stroke-width="2"/>
<rect x="498" y="298" width="154" height="34" rx="6" fill="#eceef4" stroke="#d9d1c3" stroke-width="1"/>
<text x="510" y="322" font-size="17" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">step 3</text>
<text x="636" y="322" font-size="16" fill="#f2a03d" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c3</text>
<line x1="480" y1="315" x2="444" y2="315" stroke="#f2a03d" stroke-width="2"/>
<line x1="444" y1="315" x2="444" y2="482" stroke="#f2a03d" stroke-width="2"/>
<line x1="444" y1="482" x2="266" y2="482" stroke="#f2a03d" stroke-width="2"/>
<line x1="266" y1="482" x2="266" y2="315" stroke="#f2a03d" stroke-width="2"/>
<line x1="266" y1="315" x2="210" y2="315" stroke="#f2a03d" stroke-width="2"/>
<rect x="498" y="358" width="154" height="34" rx="6" fill="#eceef4" stroke="#d9d1c3" stroke-width="1"/>
<text x="510" y="382" font-size="17" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">step 4</text>
<text x="636" y="382" font-size="16" fill="#f2a03d" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c4</text>
<line x1="480" y1="375" x2="435" y2="375" stroke="#f2a03d" stroke-width="2"/>
<line x1="435" y1="375" x2="435" y2="498" stroke="#f2a03d" stroke-width="2"/>
<line x1="435" y1="498" x2="275" y2="498" stroke="#f2a03d" stroke-width="2"/>
<line x1="275" y1="498" x2="275" y2="375" stroke="#f2a03d" stroke-width="2"/>
<line x1="275" y1="375" x2="210" y2="375" stroke="#f2a03d" stroke-width="2"/>
<text x="575" y="434" font-size="15" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">each step links back to its clue</text>
<line x1="440" y1="265" x2="480" y2="265" stroke="#2b2620" stroke-width="3"/>
<polygon points="480,265 468,257 468,273" fill="#2b2620"/>
<text x="350" y="540" font-size="17" fill="#2b2620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Nothing new appears in the solution: it only re-reads what the story already showed.</text>
