<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img">
<title>How a solve-along short mystery is built: the clues sit in plain sight in the story, a marked Pause and Solve box asks the question, and the solution at the back works through the clues one by one, each step pointing back to where its clue appeared.</title>
<desc>Three parts side by side. Left, a tall page labelled The story, with four clue markers c1 to c4 among the text lines, captioned clues c1 to c4, in plain sight. Middle, a box labelled Pause and solve: the question, a hint if wanted. Right, a page labelled The solution, at the back of the book, with four steps, each tagged with its clue number and joined by an orange return line to that clue in the story, captioned each step links back to its clue. A line below says nothing new appears in the solution: it only re-reads what the story already showed.</desc>
<rect width="700" height="560" fill="#fbf8f2"/>
<text x="350" y="46" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">How a solve-along mystery is built</text>
<text x="350" y="76" font-size="19" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Clues in the story, a marked pause, a solution that points back</text>
<rect x="40" y="110" width="190" height="300" rx="6" fill="#ffffff" stroke="#2b2620" stroke-width="3"/>
<text x="135" y="144" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The story</text>
<rect x="58" y="158" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="174" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="190" width="100" height="10" rx="5" fill="#f2a03d" stroke="#f2a03d" stroke-width="1"/>
<circle cx="196" cy="195" r="14" fill="#f2a03d"/>
<text x="196" y="202" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c1</text>
<rect x="58" y="218" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="234" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="250" width="100" height="10" rx="5" fill="#f2a03d" stroke="#f2a03d" stroke-width="1"/>
<circle cx="196" cy="255" r="14" fill="#f2a03d"/>
<text x="196" y="262" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c2</text>
<rect x="58" y="278" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="294" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="310" width="100" height="10" rx="5" fill="#f2a03d" stroke="#f2a03d" stroke-width="1"/>
<circle cx="196" cy="315" r="14" fill="#f2a03d"/>
<text x="196" y="322" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c3</text>
<rect x="58" y="338" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="354" width="154" height="8" rx="4" fill="#d9d1c3" stroke="#d9d1c3" stroke-width="1"/>
<rect x="58" y="370" width="100" height="10" rx="5" fill="#f2a03d" stroke="#f2a03d" stroke-width="1"/>
<circle cx="196" cy="375" r="14" fill="#f2a03d"/>
<text x="196" y="382" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c4</text>
<text x="135" y="434" font-size="15" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">clues c1 to c4, in plain sight</text>
<rect x="290" y="190" width="150" height="150" rx="8" fill="#eceef4" stroke="#b8323a" stroke-width="3"/>
<text x="365" y="226" font-size="22" fill="#b8323a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Pause</text>
<text x="365" y="252" font-size="22" fill="#b8323a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">and solve</text>
<text x="365" y="286" font-size="17" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">the question,</text>
<text x="365" y="310" font-size="17" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">a hint if wanted</text>
<line x1="230" y1="265" x2="290" y2="265" stroke="#2b2620" stroke-width="3"/>
<polygon points="290,265 278,257 278,273" fill="#2b2620"/>
<rect x="480" y="110" width="190" height="300" rx="6" fill="#ffffff" stroke="#2b2620" stroke-width="3"/>
<text x="575" y="144" font-size="22" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The solution</text>
<text x="575" y="166" font-size="14" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">at the back of the book</text>
<rect x="498" y="178" width="154" height="34" rx="6" fill="#eceef4" stroke="#d9d1c3" stroke-width="1"/>
