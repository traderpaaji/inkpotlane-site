<text x="636" y="202" font-size="16" fill="#f2a03d" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c1</text>
<line x1="480" y1="195" x2="462" y2="195" stroke="#f2a03d" stroke-width="2"/>
<line x1="462" y1="195" x2="462" y2="450" stroke="#f2a03d" stroke-width="2"/>
<line x1="462" y1="450" x2="248" y2="450" stroke="#f2a03d" stroke-width="2"/>
<line x1="248" y1="450" x2="248" y2="195" stroke="#f2a03d" stroke-width="2"/>
<line x1="248" y1="195" x2="210" y2="195" stroke="#f2a03d" stroke-width="2"/>
<rect x="498" y="238" width="154" height="34" rx="6" fill="#eceef4" stroke="#d9d1c3" stroke-width="1"/>
<text x="510" y="262" font-size="17" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">step 2</text>
<text x="636" y="262" font-size="16" fill="#f2a03d" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">c2</text>
<line x1="480" y1="255" x2="453" y2="255" stroke="#f2a03d" stroke-width="2"/>
<line x1="453" y1="255" x2="453" y2="466" stroke="#f2a03d" stroke-width="2"/>
<line x1="453" y1="466" x2="257" y2="466" stroke="#f2a03d" stroke-width="2"/>
