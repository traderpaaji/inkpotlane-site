<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 804" width="700" height="804" role="img">
<title>More than one Diwali story: what Hindu, Jain and Sikh families remember on the night, and the lamp in the dark they share.</title>
<desc>Four cards, each with a small lit lamp. Many Hindu families: Rama comes home to Ayodhya, and Goddess Lakshmi, who brings good fortune, is welcomed on the main night. In parts of south India: Krishna defeats the demon Narakasura. Jains: the night Lord Mahavira attained nirvana. Sikhs: Bandi Chhor Divas, the release of Guru Hargobind from Gwalior Fort, with the Golden Temple in Amritsar lit up. A dark band below reads: Each story belongs to the people who tell it. What they share is a lamp in the dark.</desc>
<rect width="700" height="804" fill="#fbf8f2"/>
<text x="350" y="50" font-size="27" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">One festival, more than one story</text>
<rect x="16" y="80" width="668" height="164" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="80" width="10" height="164" rx="4" fill="#f2a03d"/>
<path d="M 56.0 172.0 Q 82.0 200.6 108.0 172.0 Z" fill="#f2a03d" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/><line x1="56.0" y1="172.0" x2="108.0" y2="172.0" stroke="#2b2620" stroke-width="2.5"/><path d="M 82.0 145.6 C 92.7 162.2 89.8 170.0 82.0 170.0 C 74.2 170.0 71.3 162.2 82.0 145.6 Z" fill="#f6d64a" stroke="#f2a03d" stroke-width="2"/>
<text x="150" y="118" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Many Hindu families</text>
<text x="150" y="150" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Rama comes home to Ayodhya; Goddess</text>
<text x="150" y="180" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Lakshmi, who brings good fortune, is</text>
<text x="150" y="210" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">welcomed on the main night.</text>
<rect x="16" y="262" width="668" height="104" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="262" width="10" height="104" rx="4" fill="#b8323a"/>
<path d="M 56.0 324.0 Q 82.0 352.6 108.0 324.0 Z" fill="#f2a03d" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/><line x1="56.0" y1="324.0" x2="108.0" y2="324.0" stroke="#2b2620" stroke-width="2.5"/><path d="M 82.0 297.6 C 92.7 314.2 89.8 322.0 82.0 322.0 C 74.2 322.0 71.3 314.2 82.0 297.6 Z" fill="#f6d64a" stroke="#f2a03d" stroke-width="2"/>
<text x="150" y="300" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">In parts of south India</text>
<text x="150" y="332" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Krishna defeats the demon Narakasura.</text>
<rect x="16" y="384" width="668" height="104" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="384" width="10" height="104" rx="4" fill="#f2a03d"/>
<path d="M 56.0 446.0 Q 82.0 474.6 108.0 446.0 Z" fill="#f2a03d" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/><line x1="56.0" y1="446.0" x2="108.0" y2="446.0" stroke="#2b2620" stroke-width="2.5"/><path d="M 82.0 419.6 C 92.7 436.2 89.8 444.0 82.0 444.0 C 74.2 444.0 71.3 436.2 82.0 419.6 Z" fill="#f6d64a" stroke="#f2a03d" stroke-width="2"/>
<text x="150" y="422" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Jains</text>
<text x="150" y="454" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">The night Lord Mahavira attained nirvana.</text>
<rect x="16" y="506" width="668" height="164" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="506" width="10" height="164" rx="4" fill="#b8323a"/>
<path d="M 56.0 598.0 Q 82.0 626.6 108.0 598.0 Z" fill="#f2a03d" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/><line x1="56.0" y1="598.0" x2="108.0" y2="598.0" stroke="#2b2620" stroke-width="2.5"/><path d="M 82.0 571.6 C 92.7 588.2 89.8 596.0 82.0 596.0 C 74.2 596.0 71.3 588.2 82.0 571.6 Z" fill="#f6d64a" stroke="#f2a03d" stroke-width="2"/>
<text x="150" y="544" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Sikhs</text>
<text x="150" y="576" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Bandi Chhor Divas: the release of Guru</text>
<text x="150" y="606" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Hargobind from Gwalior Fort. The Golden</text>
<text x="150" y="636" font-size="23" fill="#2b2620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Temple in Amritsar is lit up.</text>
<rect x="16" y="692" width="668" height="96" rx="10" fill="#2b2620"/>
<text x="350" y="732" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Each story belongs to the people who tell it.</text>
<text x="350" y="768" font-size="25" fill="#f6d64a" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">What they share is a lamp in the dark.</text>
</svg>
