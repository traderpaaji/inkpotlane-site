<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img">
<title>Count before you write in a fill-in puzzle: a word length with one word and one slot is certain, while a shared length waits for a crossing letter.</title>
<desc>A table for a small fill-in puzzle with columns Length, Words, Slots and Move. 5 letters: BLOOM, 1 slot, row 1 across, place it first. 4 letters: MINT, 1 slot, column E down, place it first. 3 letters: BED and DEW, 2 slots, column A and row 3, wait for a crossing letter. Underneath: column A starts with the B of BLOOM, so BED goes down column A, and DEW takes row 3, which starts on the D of BED.</desc>
<rect width="700" height="520" fill="#fbf8f2"/>
<rect x="14" y="14" width="120" height="54" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
<text x="74.0" y="50" text-anchor="middle" font-size="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Length</text>
<rect x="134" y="14" width="160" height="54" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
<text x="214.0" y="50" text-anchor="middle" font-size="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Words</text>
<rect x="294" y="14" width="180" height="54" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
<text x="384.0" y="50" text-anchor="middle" font-size="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Slots</text>
<rect x="474" y="14" width="212" height="54" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
<text x="580.0" y="50" text-anchor="middle" font-size="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Move</text>
<rect x="14" y="68" width="120" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="74.0" y="124.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">5 letters</text>
<rect x="134" y="68" width="160" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="214.0" y="124.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">BLOOM</text>
<rect x="294" y="68" width="180" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="384.0" y="108.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">1 slot</text>
<text x="384.0" y="140.0" text-anchor="middle" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">row 1 across</text>
<rect x="474" y="68" width="212" height="96" rx="0" fill="#fdecc8" stroke="#d9d1c3" stroke-width="2"/>
<text x="580.0" y="124.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Place it first</text>
<rect x="14" y="164" width="120" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="74.0" y="220.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">4 letters</text>
<rect x="134" y="164" width="160" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="214.0" y="220.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">MINT</text>
<rect x="294" y="164" width="180" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="384.0" y="204.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">1 slot</text>
<text x="384.0" y="236.0" text-anchor="middle" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">column E down</text>
<rect x="474" y="164" width="212" height="96" rx="0" fill="#fdecc8" stroke="#d9d1c3" stroke-width="2"/>
<text x="580.0" y="220.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Place it first</text>
<rect x="14" y="260" width="120" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="74.0" y="316.0" text-anchor="middle" font-size="22" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">3 letters</text>
<rect x="134" y="260" width="160" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="214.0" y="316.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">BED, DEW</text>
<rect x="294" y="260" width="180" height="96" rx="0" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<text x="384.0" y="300.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">2 slots</text>
<text x="384.0" y="332.0" text-anchor="middle" font-size="20" fill="#6b6358" font-family="Georgia, 'Times New Roman', serif">column A, row 3</text>
<rect x="474" y="260" width="212" height="96" rx="0" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/>
<text x="580.0" y="300.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Wait for a</text>
<text x="580.0" y="332.0" text-anchor="middle" font-size="24" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">crossing letter</text>
<text x="350" y="410" text-anchor="middle" font-size="23" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">Column A starts with the B of BLOOM,</text>
<text x="350" y="446" text-anchor="middle" font-size="23" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">so BED goes down column A,</text>
<text x="350" y="482" text-anchor="middle" font-size="23" fill="#2b2620" font-family="Georgia, 'Times New Roman', serif">and DEW takes row 3, which starts on the D of BED.</text>
</svg>
