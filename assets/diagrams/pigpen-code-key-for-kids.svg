<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img">
<title>A pigpen code key for kids: letters sit in two tic-tac-toe grids and two X shapes, and each letter is written as the lines around its space, with a dot for the second set.</title>
<desc>A pigpen code key. Two tic-tac-toe grids: the first holds A to I, three to a row; the second holds J to R the same way, with a dot in every space. Two X shapes: the first holds S at the top, T on the left, U on the right and V at the bottom; the second holds W, X, Y and Z in the same places, each with a dot. Below, four letters drawn as their pens: A, from the top-left corner, as the lines on its right and bottom, like a backwards L; E, from the middle, as a full square; N, the middle of the second grid, as a square with a dot inside; and S, from the top of the X, as a V shape.</desc>
