<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 860" width="700" height="860" role="img">
<title>Diwali symbols and their meanings: the diya, rangoli, Lakshmi's footprints, the toran, the akash kandil and mithai.</title>
<desc>Six labelled drawings. Diya: a small clay oil lamp, light over darkness. Rangoli: a floor design at the door, made to welcome Lakshmi. Lakshmi's footprints: small steps drawn pointing into the home, inviting her in. Toran: marigolds and mango leaves over the door, a welcome. Akash kandil: a paper sky lantern hung outside the house. Mithai: sweets shared with family, friends and neighbours.</desc>
