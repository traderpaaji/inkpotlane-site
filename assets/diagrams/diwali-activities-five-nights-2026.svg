<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 690" width="700" height="690" role="img">
<title>Five Diwali activities for kids across the festival sequence: paint a diya for Dhanteras, make a paper lantern for Choti Diwali, draw a rangoli for Lakshmi Puja, build a mountain of sweets for Govardhan Puja, and make a sibling card for Bhai Dooj.</title>
<desc>Five rows show a sequence of Diwali activities. Dhanteras: paint one clay diya. Choti Diwali: make a paper lantern. Lakshmi Puja, the main night: draw a rangoli at the door. Govardhan Puja: build a small mountain of sweets. Bhai Dooj: make a card for a brother or sister. Exact dates depend on location and the local calendar.</desc>
<rect width="700" height="690" fill="#fbf8f2"/>
<text x="350" y="46" font-size="25" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Diwali 2026: five nights, one small thing each</text>
