<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 744" width="700" height="744" role="img">
<title>What goes in a final affairs organizer: the people to call, where documents and accounts are, bills, digital life, wishes and letters, one area at a time.</title>
<desc>A checklist of seven areas for a final affairs organizer. People to call first: family, close friends, solicitor and accountant. Important documents: where each one is kept. Financial accounts: banks, investments and debts, and where details are kept. Insurance, home and bills: policies, vehicles, subscriptions and recurring charges. Digital life: key accounts and where access instructions are stored. Medical information, wishes, pets and funeral: notes that help family know your wishes. Things to pass on and letters: keepsakes, stories and personal messages.</desc>
