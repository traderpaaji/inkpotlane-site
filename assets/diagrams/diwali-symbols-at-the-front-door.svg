<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 670" width="700" height="670" role="img">
<title>Where Diwali symbols are placed at home: a toran over the main door, an akash kandil hung outside, diyas along the step, a rangoli at the entrance and footprints pointing inside.</title>
<desc>A drawing of a front door on Diwali night. A toran of mango leaves and marigolds hangs across the top of the door. A paper sky lantern hangs to the right. Small clay diyas sit along the step. A round rangoli is drawn on the ground in front of the door, and two small footprints lead from it towards the door. A line underneath says a plate of mithai waits inside to be shared.</desc>
