<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640" role="img">
<title>Dated vs undated planner after a missed week: printed dates leave empty boxes behind, while an undated planner simply carries on with today's date.</title>
<desc>Two panels side by side. Left, dated planner: the week you planned is written in, then two weeks with printed days and empty boxes are outlined in red as the gap that stays, then the week you come back. Caption: printed dates, empty boxes. Right, undated planner: the week you planned, then the next blank spread headed week of: today's date, written in straight away. Caption: no blank pages, just carry on.</desc>
