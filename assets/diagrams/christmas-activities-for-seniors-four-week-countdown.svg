<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 669" width="700" height="669" role="img">
<title>A four-week Christmas countdown for seniors: cards and a letter to Santa, ornament stories, one family recipe, then the old songs and the lights.</title>
<desc>Four week cards in order. Week 1: cards, and a letter to Santa; one line per card, and the letter goes out early because both have to travel. Week 2: the tree, one ornament at a time; ask for the story behind each one. Week 3: one family recipe; bake it together and write it down while it's made. Week 4: the old songs and the lights; sing them all the way through, then a drive at dusk. Below: the evenings in between, a story in installments.</desc>
<rect width="700" height="669" fill="#fbf8f2"/>
<text x="350.0" y="50.0" font-size="30" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">One small thing a week</text>
<text x="350.0" y="84.0" font-size="22" fill="#6b6358" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">a gentle four-week Christmas countdown</text>
<rect x="24.0" y="108.0" width="652.0" height="121.1" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="24" y="108.0" width="120" height="121.1" rx="10" fill="#b8323a"/>
<text x="84.0" y="177.6" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Week 1</text>
<text x="172.0" y="144.0" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Cards, and a letter to Santa</text>
<text x="172.0" y="176.5" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">One line per card. The letter goes out early, because</text>
<text x="172.0" y="203.8" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">both have to travel.</text>
<rect x="24.0" y="243.1" width="652.0" height="96.0" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="24" y="243.1" width="120" height="96.0" rx="10" fill="#2f6b45"/>
<text x="84.0" y="300.1" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Week 2</text>
<text x="172.0" y="279.1" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The tree, one ornament at a time</text>
<text x="172.0" y="311.6" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Ask for the story behind each one before it goes on.</text>
<rect x="24.0" y="353.1" width="652.0" height="96.0" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="24" y="353.1" width="120" height="96.0" rx="10" fill="#b8323a"/>
<text x="84.0" y="410.1" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Week 3</text>
<text x="172.0" y="389.1" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">One family recipe</text>
<text x="172.0" y="421.6" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Bake it together and write it down while it's made.</text>
<rect x="24.0" y="463.1" width="652.0" height="96.0" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="24" y="463.1" width="120" height="96.0" rx="10" fill="#2f6b45"/>
<text x="84.0" y="520.1" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Week 4</text>
<text x="172.0" y="499.1" font-size="25" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The old songs and the lights</text>
<text x="172.0" y="531.6" font-size="21" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Sing them all the way through, then a drive at dusk.</text>
<rect x="24.0" y="577.1" width="652.0" height="69.9" rx="10" fill="#f3ede2" stroke="#d9d1c3" stroke-width="2"/>
<text x="350.0" y="613.1" font-size="23" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">The evenings in between: a story in installments</text>
</svg>
