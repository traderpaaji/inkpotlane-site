<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img">
<title>Three example wheel of life score patterns: a small even shape, a lopsided shape and a shape with one low-scoring area.</title>
<desc>Three wheels of life side by side, each with a shaded shape joining eight scores. First: a small, even shape, most areas similar and low. Second: a lopsided shape with one area, labeled work, much higher than the rest. Third: a large shape with one area much lower than the rest. The examples show score patterns to notice, not diagnoses.</desc>
