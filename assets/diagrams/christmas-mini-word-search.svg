<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
<title>A five-by-four Christmas word search: find STAR, NOEL, SNOW and GIFT, then read the six leftover letters in order to get the hidden message.</title>
<desc>A grid of letters, five across and four down. Row one reads S T A R J. Row two reads N O E L O. Row three reads O Y F U L. Row four reads W G I F T. Below it, the words to find: STAR, NOEL, SNOW and GIFT. A note says the words run across or down, and the six letters left over, read left to right and top to bottom, are the hidden message.</desc>
<rect width="700" height="600" fill="#fbf8f2"/>
<text x="350" y="50" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Rung one: a hidden-message word search</text>
