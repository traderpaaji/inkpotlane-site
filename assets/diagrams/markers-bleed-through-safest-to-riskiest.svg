<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 796" width="700" height="796" role="img">
<title>Bleed-through risk varies by coloring tool and paper: dry media such as crayons and colored pencils generally pose less risk, while alcohol-based markers often pose more.</title>
<desc>Seven coloring tools arranged from generally lower to generally higher bleed-through risk: crayons, colored pencils, water-based fine-tip markers, water-based brush pens, gel pens, paint or acrylic markers, and alcohol-based markers. The order is a rough guide that varies with paper, ink and layering. A footer says to test one color first and place card behind the page.</desc>
<rect width="700" height="796" fill="#fbf8f2"/>
<text x="16" y="44" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">GENERALLY LOWER RISK</text>
<rect x="16" y="64" width="668" height="78" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="64" width="64" height="78" rx="10" fill="#efe6b0" stroke="#d9d1c3" stroke-width="2"/>
<text x="48" y="113" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="100" y="98" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Crayons</text>
<text x="100" y="128" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">No wet ink. Big shapes.</text>
<rect x="16" y="152" width="668" height="78" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="152" width="64" height="78" rx="10" fill="#f0cf8a" stroke="#d9d1c3" stroke-width="2"/>
<text x="48" y="201" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="100" y="186" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Colored pencils</text>
<text x="100" y="216" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">No wet ink. Ideal for detail and shading.</text>
<rect x="16" y="240" width="668" height="78" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="240" width="64" height="78" rx="10" fill="#f1b763" stroke="#d9d1c3" stroke-width="2"/>
<text x="48" y="289" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="100" y="274" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Water-based fine-tip markers</text>
<text x="100" y="304" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Less likely to bleed; a little ghosting is normal.</text>
<rect x="16" y="328" width="668" height="78" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="328" width="64" height="78" rx="10" fill="#f2a03d" stroke="#d9d1c3" stroke-width="2"/>
<text x="48" y="377" font-size="28" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="100" y="362" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Water-based brush pens</text>
<text x="100" y="392" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Usually fine; wetter ones can soak through if layered.</text>
<rect x="16" y="416" width="668" height="78" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="416" width="64" height="78" rx="10" fill="#df7b3c" stroke="#d9d1c3" stroke-width="2"/>
<text x="48" y="465" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">5</text>
<text x="100" y="450" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Gel pens</text>
<text x="100" y="480" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Rarely bleed, but smudge while wet. Let it dry.</text>
<rect x="16" y="504" width="668" height="78" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="504" width="64" height="78" rx="10" fill="#cb573b" stroke="#d9d1c3" stroke-width="2"/>
<text x="48" y="553" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">6</text>
<text x="100" y="538" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Paint pens and acrylic markers</text>
<text x="100" y="568" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Heavy and wet: try a spare corner first.</text>
<rect x="16" y="592" width="668" height="78" rx="10" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<rect x="16" y="592" width="64" height="78" rx="10" fill="#b8323a" stroke="#d9d1c3" stroke-width="2"/>
<text x="48" y="641" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">7</text>
<text x="100" y="626" font-size="24" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Alcohol-based markers</text>
<text x="100" y="656" font-size="22" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Very likely to bleed through: blank back, card under.</text>
<text x="16" y="702" font-size="22" fill="#b8323a" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">GENERALLY HIGHER RISK (varies with paper and ink)</text>
<rect x="16" y="724" width="668" height="56" rx="10" fill="#2b2620"/>
<text x="350" y="761" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Always: test one color first, card behind the page</text>
</svg>
