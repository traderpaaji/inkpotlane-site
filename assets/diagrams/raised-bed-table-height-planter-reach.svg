<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 610" width="700" height="610" role="img">
<title>Raised beds and table-height planters bring the garden up to an elderly gardener, so plants can be tended standing or sitting.</title>
<desc>Side view of three planting heights on one ground line, with a dashed arrow rising across them. Left: a flat bed at ground level, labelled down at soil level. Middle: a wooden raised bed, labelled warms up sooner in spring and drains better. Right: a planter on legs at table height, labelled tend plants standing or sitting. Heading: if getting down to the soil is the problem, raise the soil.</desc>
<rect width="700" height="610" fill="#fbf8f2"/>
<text x="350" y="46" font-size="26" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">If getting down to the soil is the problem,</text>
<text x="350" y="80" font-size="26" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">raise the soil.</text>
