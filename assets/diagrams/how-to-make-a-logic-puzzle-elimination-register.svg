<text x="540" y="102" font-size="13" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">no umbrella</text>
<text x="610" y="82" font-size="15" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Clue 4</text>
<text x="610" y="102" font-size="13" fill="#6b6358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">not green</text>
