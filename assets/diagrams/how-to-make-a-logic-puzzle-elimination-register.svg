<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
<title>Who took the last mince pie, clue by clue: not wearing blue rules out Dev and Frank; arriving after 3:20 rules out Agnes and Hal; not arriving with an umbrella rules out Gwen; not wearing green rules out Bert and Elsie. Cora remains. Six, four, three, then one suspect left.</title>
<desc>A register of eight suspects with scarf color, arrival time and what they carried, and four clue columns. Agnes, red, 3:10, lantern: out at clue 2. Bert, green, 3:25, basket: out at clue 4. Cora, red, 3:40, basket: survives every clue and is highlighted. Dev, blue, 3:45, basket: out at clue 1. Elsie, green, 3:50, lantern: out at clue 4. Frank, blue, 3:35, umbrella: out at clue 1. Gwen, red, 3:55, umbrella: out at clue 3. Hal, green, 3:05, basket: out at clue 2. The counts left after each clue are 6, 4, 3 and 1. A note says that dropping any one clue lets someone else survive.</desc>
