<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 728" width="728" height="728" role="img">
<title>A blank 9x9 grid for goal setting: the main goal goes in the center, eight supports around it, and each support is copied to the middle of its own outer block with eight actions around it.</title>
<desc>A blank 9 by 9 grid of 81 squares divided into nine 3 by 3 blocks by thick lines. The center square says MAIN GOAL. The eight squares around it are numbered 1 to 8, starting top left and going clockwise. The middle square of each outer block carries the matching number, 1 to 8, in the same position. All other squares are empty, for the actions.</desc>
