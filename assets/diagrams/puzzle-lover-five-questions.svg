<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" width="700" height="510" role="img">
<title>Five questions before you buy a puzzle book as a gift: look or work out, a story around it, comfortable print, beginner or veteran, alone or at the table.</title>
<desc>Five numbered cards. 1: Look or work out? Hunting for words, or cracking a code, a grid or a case. 2: A story around it? A plain grid for switching off, or a reason for the puzzle. 3: Comfortable print? If in doubt, large print on every page, answers too. 4: Beginner or veteran? Choose a little easy rather than a little hard. 5: Alone or at the table? A chair by the fire, or a book to pass around.</desc>
<rect width="700" height="510" fill="#fbf8f2"/>
<text x="350" y="40" font-size="24" fill="#2b2620" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Five questions before you buy a puzzle book</text>
<rect x="40" y="70" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="105" r="20" fill="#4f2840"/>
<text x="80" y="112" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">1</text>
<text x="118" y="100" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Look or work out?</text>
<text x="118" y="125" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Hunting for words, or cracking a code, a grid or a case?</text>
<rect x="40" y="154" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="189" r="20" fill="#4f2840"/>
<text x="80" y="196" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">2</text>
<text x="118" y="184" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A story around it?</text>
<text x="118" y="209" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Plain grid for switching off, or a reason for the puzzle?</text>
<rect x="40" y="238" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="273" r="20" fill="#4f2840"/>
<text x="80" y="280" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">3</text>
<text x="118" y="268" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Comfortable print?</text>
<text x="118" y="293" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">If in doubt, large print on every page, answers too.</text>
<rect x="40" y="322" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="357" r="20" fill="#4f2840"/>
<text x="80" y="364" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">4</text>
<text x="118" y="352" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Beginner or veteran?</text>
<text x="118" y="377" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Choose a little easy rather than a little hard.</text>
<rect x="40" y="406" width="620" height="70" rx="8" fill="#ffffff" stroke="#d9d1c3" stroke-width="2"/>
<circle cx="80" cy="441" r="20" fill="#4f2840"/>
<text x="80" y="448" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">5</text>
<text x="118" y="436" font-size="19" fill="#2b2620" text-anchor="start" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">Alone or at the table?</text>
<text x="118" y="461" font-size="16" fill="#6b6358" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">A chair by the fire, or a book to pass around?</text>
</svg>
